}

// ═══ AI CHAT — TRỢ LÝ ═══
function AIChatTab({t,msg}){
  const STORAGE_KEY="mam_ai_chats";
  const [convos,setConvos]=useState(()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch{return[];}});
  const [activeId,setActiveId]=useState(()=>{try{return localStorage.getItem("mam_ai_active")||"";}catch{return"";}});
  const [input,setInput]=useState("");
  const [aiModel,setAiModel]=useState("gemini-flash");
  const [loading,setLoading]=useState(false);
  const [chatImages,setChatImages]=useState([]);
  const [showRecent,setShowRecent]=useState(false);
  const chatRef=useRef(null);
  const fileRef=useRef(null);
  const inp={padding:"10px 14px",borderRadius:10,border:`1.5px solid ${t.bd}`,background:t.inp||t.sf,color:t.tx,fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",fontFamily:"inherit"};

  const save=(newConvos,newActiveId)=>{try{const clean=newConvos.map(c=>({...c,messages:c.messages.map(m=>m.images?{...m,images:undefined,hasImage:true}:m)}));localStorage.setItem(STORAGE_KEY,JSON.stringify(clean));if(newActiveId!==undefined)localStorage.setItem("mam_ai_active",newActiveId);}catch(e){console.error("Save failed:",e);}};
  const active=convos.find(c=>c.id===activeId);
  const messages=active?active.messages:[];

  const newChat=()=>{
    const id="chat_"+Date.now();
    const c={id,title:"Chat mới",model:aiModel,updatedAt:new Date().toISOString(),messages:[]};
    const next=[c,...convos];
    setConvos(next);setActiveId(id);save(next,id);setShowRecent(false);
  };

  const deleteChat=(id)=>{
    const next=convos.filter(c=>c.id!==id);
    setConvos(next);
    if(activeId===id){const newId=next.length>0?next[0].id:"";setActiveId(newId);save(next,newId);}
    else save(next);
  };

  const addImage=(file)=>{
    if(!file||!file.type.startsWith("image/"))return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{const MAX=500;let w=img.width,h=img.height;if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);setChatImages(prev=>[...prev,c.toDataURL("image/jpeg",0.85)]);};
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handlePaste=useCallback((e)=>{
    const items=e.clipboardData?.items;
    if(!items)return;
    for(let i=0;i<items.length;i++){
      if(items[i].type.startsWith("image/")){e.preventDefault();addImage(items[i].getAsFile());return;}
    }
  },[]);

  const send=async()=>{
    if((!input.trim()&&chatImages.length===0)||loading)return;
    const userMsg=input.trim()||"Xem ảnh này";
    const userImages=[...chatImages];
    setInput("");setChatImages([]);
    let curId=activeId;
    let curConvos=[...convos];
    if(!curId||!curConvos.find(c=>c.id===curId)){
      curId="chat_"+Date.now();
      curConvos=[{id:curId,title:userMsg.slice(0,30),model:aiModel,updatedAt:new Date().toISOString(),messages:[]},...curConvos];
      setActiveId(curId);
    }
    const userEntry={role:"user",text:userMsg,images:userImages.length>0?userImages:undefined};
    curConvos=curConvos.map(c=>c.id===curId?{...c,messages:[...c.messages,userEntry],updatedAt:new Date().toISOString(),title:c.messages.length===0?userMsg.slice(0,30):c.title}:c);
    setConvos(curConvos);save(curConvos,curId);
    setLoading(true);
    try{
      const chat=curConvos.find(c=>c.id===curId);
      const historyForAPI=chat.messages.slice(0,-1).map(m=>({role:m.role==="user"?"user":"ai",text:m.text}));
      const body={action:"aiChat",message:userMsg,aiModel,history:historyForAPI};
      if(userImages.length>0)body.images=userImages;
      const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data=await res.json();
      const aiEntry={role:"ai",text:data.success?data.reply:"❌ "+(data.error||"Lỗi")};
      const updated=curConvos.map(c=>c.id===curId?{...c,messages:[...c.messages,aiEntry],updatedAt:new Date().toISOString()}:c);
      setConvos(updated);save(updated,curId);
    }catch(e){
      const aiEntry={role:"ai",text:"❌ "+e.message};
      const updated=curConvos.map(c=>c.id===curId?{...c,messages:[...c.messages,aiEntry]}:c);
      setConvos(updated);save(updated);
    }
    setLoading(false);
    setTimeout(()=>{if(chatRef.current)chatRef.current.scrollTop=chatRef.current.scrollHeight;},100);
  };

  const quick=["Hôm nay bán được bao nhiêu?","SP nào bán chạy nhất?","Có bao nhiêu đơn chưa CK?","Viết bài FB cho SP hot nhất","Tổng hàng dư hiện tại?"];

  return <div onPaste={handlePaste} style={{display:"flex",flexDirection:"column",height:"calc(100vh - 120px)"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <h2 style={{fontSize:18,fontWeight:800,color:t.tx,margin:0}}>💬 Trợ lý</h2>
        <button onClick={()=>setShowRecent(!showRecent)} style={{padding:"3px 8px",borderRadius:5,border:`1px solid ${t.bd}`,background:t.sf,color:t.dm,fontSize:10,cursor:"pointer"}}>{convos.length>0?`📂 ${convos.length}`:"📂"}</button>
        <button onClick={newChat} style={{padding:"3px 8px",borderRadius:5,border:`1px solid ${t.ac}`,background:t.ab||t.sf,color:t.ac,fontSize:10,cursor:"pointer",fontWeight:600}}>+ Mới</button>
      </div>
      <select value={aiModel} onChange={e=>setAiModel(e.target.value)} style={{padding:"5px 8px",borderRadius:6,border:`1px solid ${t.bd}`,background:t.sf,color:t.tx,fontSize:11}}>
        <option value="gemini-flash">⚡ Gemini Flash</option>
        <option value="gemini-pro">🧠 Gemini Pro</option>
        <option value="claude-haiku">⚡ Claude Haiku</option>
        <option value="claude-sonnet">🧠 Sonnet 3.5</option>
        <option value="claude-sonnet46">🧠 Sonnet 4.6</option>
      </select>
    </div>

    {showRecent&&<div style={{background:t.sf,border:`1px solid ${t.bd}`,borderRadius:10,padding:8,marginBottom:8,maxHeight:200,overflowY:"auto"}}>
      <div style={{fontSize:11,fontWeight:600,color:t.dm,marginBottom:6}}>📂 Lịch sử chat</div>
      {convos.length===0&&<div style={{fontSize:11,color:t.dm,padding:8}}>Chưa có chat nào</div>}
      {convos.map(c=><div key={c.id} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",borderRadius:6,marginBottom:2,background:c.id===activeId?t.ab:"transparent",cursor:"pointer"}} onClick={()=>{setActiveId(c.id);localStorage.setItem("mam_ai_active",c.id);setShowRecent(false);}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:c.id===activeId?700:400,color:t.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.title}</div>
          <div style={{fontSize:9,color:t.dm}}>{c.messages.length} tin · {new Date(c.updatedAt).toLocaleDateString("vi-VN")}</div>
        </div>
        <button onClick={e=>{e.stopPropagation();if(confirm("Xoá chat?"))deleteChat(c.id);}} style={{border:"none",background:"none",cursor:"pointer",fontSize:10,color:t.dm}}>🗑</button>
      </div>)}
    </div>}

    <div ref={chatRef} style={{flex:1,overflowY:"auto",marginBottom:10,padding:4}}>
      {messages.length===0&&<div style={{textAlign:"center",padding:30}}>
        <div style={{fontSize:40,marginBottom:10}}>💬</div>
        <div style={{color:t.dm,fontSize:13,marginBottom:16}}>Hỏi bất cứ gì — AI biết data Shop MAM realtime</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center"}}>
          {quick.map((q,i)=><button key={i} onClick={()=>setInput(q)} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${t.bd}`,background:t.sf,color:t.ac,fontSize:11,cursor:"pointer"}}>{q}</button>)}
        </div>
        <div style={{color:t.dm,fontSize:10,marginTop:12}}>📸 Ctrl+V paste ảnh · 📎 chọn file</div>
      </div>}

      {messages.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",marginBottom:8}}>
        <div style={{maxWidth:"85%",padding:"10px 14px",borderRadius:m.role==="user"?"14px 14px 4px 14px":"14px 14px 14px 4px",background:m.role==="user"?t.ac:t.sf,color:m.role==="user"?"#fff":t.tx,fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap",border:m.role==="user"?"none":`1px solid ${t.bd}`}}>
          {m.images&&m.images.length>0&&<div style={{display:"flex",gap:4,marginBottom:6,flexWrap:"wrap"}}>{m.images.map((img,j)=><img key={j} src={img} alt="" style={{width:80,height:80,objectFit:"cover",borderRadius:6}}/>)}</div>}
          {m.hasImage&&!m.images&&<div style={{fontSize:11,color:m.role==="user"?"#ddd":"#999",marginBottom:4}}>📸 Có ảnh đính kèm</div>}
          {m.text}
        </div>
      </div>)}

      {loading&&<div style={{display:"flex",justifyContent:"flex-start",marginBottom:8}}>
        <div style={{padding:"10px 14px",borderRadius:"14px 14px 14px 4px",background:t.sf,border:`1px solid ${t.bd}`,fontSize:13,color:t.dm}}>🔄 Đang nghĩ...</div>
      </div>}
    </div>

    {chatImages.length>0&&<div style={{display:"flex",gap:6,marginBottom:6,padding:"6px 8px",background:t.sf,borderRadius:8,border:`1px solid ${t.bd}`}}>
      {chatImages.map((img,i)=><div key={i} style={{position:"relative",width:50,height:50,borderRadius:6,overflow:"hidden"}}>
        <img src={img} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
        <button onClick={()=>setChatImages(prev=>prev.filter((_,j)=>j!==i))} style={{position:"absolute",top:1,right:1,width:16,height:16,borderRadius:"50%",border:"none",background:"rgba(0,0,0,0.7)",color:"#fff",fontSize:9,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
      </div>)}
    </div>}

    <div style={{display:"flex",gap:6}}>
      <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={e=>{Array.from(e.target.files).forEach(addImage);e.target.value="";}}/>
      <button onClick={()=>fileRef.current?.click()} style={{padding:"10px",borderRadius:10,border:`1px solid ${t.bd}`,background:t.sf,color:t.dm,fontSize:16,cursor:"pointer"}} title="Đính kèm ảnh">📎</button>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Hỏi gì đó..." style={{...inp,flex:1}} disabled={loading}/>
      <button onClick={send} disabled={loading||(!input.trim()&&chatImages.length===0)} style={{padding:"10px 16px",borderRadius:10,border:"none",background:(input.trim()||chatImages.length>0)?t.ac:t.bd,color:"#fff",fontSize:14,fontWeight:700,cursor:(input.trim()||chatImages.length>0)?"pointer":"not-allowed"}}>➤</button>
    </div>
  </div>;
}

function AITab({t,msg,catalog,onDone}){
  const [mode,setMode]=useState("text");
  const [aiModel,setAiModel]=useState("gemini-flash");
  const [textInput,setTextInput]=useState("");
  const [images,setImages]=useState([]);
  const [contextSP,setContextSP]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [error,setError]=useState("");
  const [selected,setSelected]=useState({});
  const [editData,setEditData]=useState({});
  const [adding,setAdding]=useState(false);
  const [addResult,setAddResult]=useState(null);
  const fileRef=useRef(null);

  const handlePaste=useCallback((e)=>{
    const items=e.clipboardData?.items;
    if(!items)return;
    for(let i=0;i<items.length;i++){
      if(items[i].type.startsWith("image/")){
        e.preventDefault();
        const file=items[i].getAsFile();
        readFile(file);
        setMode("image");
        return;
      }
    }
  },[]);

  const readFile=(file)=>{
    if(!file||!file.type.startsWith("image/"))return;
    if(file.size>10*1024*1024){setError("Ảnh quá lớn (>10MB)");return;}
    const reader=new FileReader();
    reader.onload=(ev)=>{
      const img=new Image();
      img.onload=()=>{
        const MAX_W=600;
        let w=img.width,h=img.height;
        if(w>MAX_W){h=Math.round(h*MAX_W/w);w=MAX_W;}
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        const resized=canvas.toDataURL("image/jpeg",0.85);
        setImages(prev=>[...prev,{data:resized,preview:resized}]);
        setError("");
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  };

  const handleDrop=(e)=>{e.preventDefault();e.stopPropagation();const files=e.dataTransfer?.files;if(files){for(let i=0;i<files.length;i++)readFile(files[i]);setMode("image");}};

  const handleParse=async()=>{
    if(mode==="text"&&!textInput.trim()){setError("Nhập tin nhắn khách");return;}
    if(mode==="image"&&images.length===0){setError("Thêm ít nhất 1 ảnh");return;}
    setLoading(true);setError("");setResult(null);setSelected({});
    try{
      const body={action:"parseOrderAI",inputType:mode,input:mode==="image"?images.map(img=>img.data):textInput,contextSP:contextSP.trim().replace(/^#/,"").toUpperCase(),aiModel};
      const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data=await res.json();
      if(!data.success){setError(data.error||"Lỗi");}
      else if(!data.orders||data.orders.length===0){setError("Không tìm thấy đơn"+(data.note?": "+data.note:""));}
      else{
        setResult(data);
        const sel={},ed={};
        data.orders.forEach((ord,i)=>{sel[i]=true;ed[i]={link_fb:ord.link_fb||"",dia_chi:ord.dia_chi||""};});
        setSelected(sel);setEditData(ed);
      }
    }catch(err){setError("Lỗi: "+err.message);}
    setLoading(false);
  };

  const handleAddToSheets=async()=>{
    if(!result?.orders)return;
    const cnt=Object.values(selected).filter(Boolean).length;
    if(cnt===0){setError("Chọn ít nhất 1 đơn");return;}
    setAdding(true);setAddResult(null);
    let ok=0,fail=0;
    for(let idx=0;idx<result.orders.length;idx++){
      if(!selected[idx])continue;
      const ord=result.orders[idx];
      const extra=editData[idx]||{};
      const tenKhach=extra.ten_khach!==undefined?extra.ten_khach:ord.ten_khach||"";
      const maSP=extra.ma_sp!==undefined?extra.ma_sp:ord.ma_sp||"";
      const size=extra.size!==undefined?extra.size:ord.size||"";
      const color=extra.color!==undefined?extra.color:ord.color||"";
      const soLuong=parseInt(extra.so_luong!==undefined?extra.so_luong:ord.so_luong)||1;
      try{
        const cat=catalog.find(c=>String(c["Mã SP"]||"").trim().toUpperCase()===String(maSP||"").trim().toUpperCase());
        const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"addOrder",order:{tenKhach,tenSp:cat?cat["Tên SP"]:"",maSP,size,color,soLuong,giaSp:cat?Number(cat["Giá bán"])||0:0,linkFb:extra.link_fb||ord.link_fb||""}})});
        const data=await res.json();
        if(data.success)ok++;else fail++;
      }catch{fail++;}
    }
    setAddResult({ok,fail,total:ok+fail});
    setAdding(false);
    if(fail===0){msg(`✅ Đã nhập ${ok} đơn!`);setTimeout(()=>{setResult(null);setTextInput("");setImages([]);setContextSP("");setAddResult(null);setEditData({});onDone();},1500);}
  };

  const toggleSelect=(i)=>setSelected(prev=>({...prev,[i]:!prev[i]}));
  const updateEdit=(i,field,value)=>{
    setEditData(prev=>{
      const next={...prev,[i]:{...prev[i],[field]:value}};
      if(result?.orders){const name=result.orders[i]?.ten_khach;if(name){result.orders.forEach((ord,j)=>{if(j!==i&&ord.ten_khach===name)next[j]={...next[j],[field]:value};});}}
      return next;
    });
  };
  const selectAll=()=>{if(!result?.orders)return;const all=result.orders.every((_,i)=>selected[i]);const sel={};result.orders.forEach((_,i)=>{sel[i]=!all;});setSelected(sel);};
  const selectedCount=Object.values(selected).filter(Boolean).length;

  const inp={padding:"10px 14px",borderRadius:10,border:`1.5px solid ${t.bd}`,background:t.inp||t.sf,color:t.tx,fontSize:14,width:"100%",boxSizing:"border-box",outline:"none",fontFamily:"inherit"};

  return <div onPaste={handlePaste}>
    <h2 style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:4}}>🤖 AI Nhập Đơn</h2>
    <p style={{color:t.dm,fontSize:11,marginBottom:12}}>Paste tin nhắn hoặc screenshot → parse đơn hàng</p>

    {/* Mode toggle */}
    <div style={{display:"flex",gap:6,marginBottom:12}}>
      {[{id:"text",icon:"💬",l:"Tin nhắn"},{id:"image",icon:"📸",l:"Screenshot"}].map(m=>
        <button key={m.id} onClick={()=>{setMode(m.id);setError("");}} style={{flex:1,padding:"10px 0",border:`1.5px solid ${mode===m.id?t.ac:t.bd}`,borderRadius:10,background:mode===m.id?t.ab:t.sf,color:mode===m.id?t.ac:t.dm,fontSize:13,fontWeight:600,cursor:"pointer"}}>{m.icon} {m.l}</button>
      )}
    </div>

    {/* Model selector */}
    <div style={{marginBottom:12}}>
      <label style={{fontSize:11,color:t.dm,marginBottom:4,display:"block"}}>AI Model</label>
      <select value={aiModel} onChange={e=>setAiModel(e.target.value)} style={{...inp,padding:"8px 10px",fontSize:12}}>
        <option value="gemini-flash">⚡ Gemini Flash (miễn phí, nhanh)</option>
        <option value="gemini-pro">🧠 Gemini Pro (miễn phí, đọc ảnh tốt)</option>
        <option value="claude-haiku">⚡ Claude Haiku (rẻ, nhanh)</option>
        <option value="claude-sonnet">🧠 Sonnet 3.5</option>
        <option value="claude-sonnet46">🧠 Sonnet 4.6</option>
      </select>
    </div>

    {/* Context SP */}
    <div style={{marginBottom:10}}>
      <label style={{fontSize:11,color:t.dm,marginBottom:4,display:"block"}}>Mã SP bài đăng (tuỳ chọn)</label>
      <input value={contextSP} onChange={e=>setContextSP(e.target.value)} placeholder="VD: AK01" style={{...inp,fontWeight:600,letterSpacing:"0.05em"}}/>
    </div>

    {/* Input */}
    {mode==="text"?
      <textarea value={textInput} onChange={e=>setTextInput(e.target.value)} placeholder={"Paste tin nhắn khách...\n\nVD:\ncho e 1 cái AK01 M đen\nvới 1 QJ02 L trắng\n\nHoặc nhiều khách:\nHà Giang: M đen 1 cái\nKim Cúc: S trắng"} style={{...inp,minHeight:140,resize:"vertical",lineHeight:1.6}}/>
    :
      <div onDrop={handleDrop} onDragOver={e=>e.preventDefault()} onClick={()=>fileRef.current?.click()} style={{border:`2px dashed ${images.length>0?t.ac:t.bd}`,borderRadius:14,padding:images.length>0?12:40,textAlign:"center",cursor:"pointer",background:t.sf,minHeight:120}}>
        <input ref={fileRef} type="file" accept="image/*" multiple hidden onChange={e=>{Array.from(e.target.files).forEach(readFile);e.target.value="";}}/>
        {images.length===0?
          <div><div style={{fontSize:36,marginBottom:8}}>📸</div><div style={{color:t.dm,fontSize:13}}>Kéo thả / Bấm chọn / <span style={{color:t.ac,fontWeight:600}}>Ctrl+V paste</span></div></div>
        :
          <div><div style={{display:"flex",gap:8,flexWrap:"wrap",justifyContent:"center"}}>
            {images.map((img,i)=><div key={i} style={{position:"relative",width:100,height:100,borderRadius:10,overflow:"hidden",border:`1px solid ${t.bd}`}}>
              <img src={img.preview} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
              <button onClick={e=>{e.stopPropagation();setImages(prev=>prev.filter((_,j)=>j!==i));}} style={{position:"absolute",top:3,right:3,width:20,height:20,borderRadius:"50%",border:"none",background:"rgba(0,0,0,0.7)",color:"#fff",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            </div>)}
            <div style={{width:100,height:100,borderRadius:10,border:`2px dashed ${t.bd}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,color:t.dm}}>+</div>
          </div><div style={{fontSize:11,color:t.dm,marginTop:8}}>{images.length} ảnh</div></div>
        }
      </div>
    }

    {error&&<div style={{marginTop:10,padding:"10px 14px",borderRadius:10,background:"#FEE2E2",border:"1px solid #FECACA",color:"#DC2626",fontSize:12}}>⚠️ {error}</div>}

    {/* Parse button */}
    <button onClick={handleParse} disabled={loading} style={{width:"100%",marginTop:12,padding:"14px 0",borderRadius:12,border:"none",background:loading?t.bd:t.ac,color:"#fff",fontSize:15,fontWeight:700,cursor:loading?"wait":"pointer",opacity:loading?.7:1}}>
      {loading?"🔄 Đang đọc...":"🤖 Parse đơn hàng"}
    </button>

    {/* Results */}
    {result&&result.orders&&result.orders.length>0&&<div style={{marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <div style={{fontSize:14,fontWeight:700,color:t.tx}}>✅ {result.orders.length} đơn</div>
        <button onClick={selectAll} style={{padding:"4px 10px",borderRadius:6,border:`1px solid ${t.bd}`,background:t.sf,color:t.dm,fontSize:11,cursor:"pointer"}}>{selectedCount===result.orders.length?"Bỏ chọn":"Chọn hết"}</button>
      </div>
      {result.note&&<div style={{padding:"8px 12px",borderRadius:8,background:"#FEF3C7",border:"1px solid #FDE68A",color:"#92400E",fontSize:11,marginBottom:10}}>💡 {result.note}</div>}

      {result.orders.map((ord,i)=>{const ed=editData[i]||{};const name=ed.ten_khach!==undefined?ed.ten_khach:ord.ten_khach;const ma=ed.ma_sp!==undefined?ed.ma_sp:ord.ma_sp;const sz=ed.size!==undefined?ed.size:ord.size;const cl=ed.color!==undefined?ed.color:ord.color;const sl=ed.so_luong!==undefined?ed.so_luong:ord.so_luong;
        return <div key={i} style={{marginBottom:8,borderRadius:10,background:selected[i]?"#F0FDF4":t.sf,border:`1.5px solid ${selected[i]?"#86EFAC":ord.unclear?"#FDE68A":t.bd}`,overflow:"hidden"}}>
        <div onClick={()=>toggleSelect(i)} style={{padding:"10px 12px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:20,height:20,borderRadius:5,flexShrink:0,border:`2px solid ${selected[i]?"#16A34A":t.bd}`,background:selected[i]?"#16A34A":"transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:12,fontWeight:700}}>{selected[i]&&"✓"}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontWeight:700,fontSize:13,color:t.tx}}>{name||"(chưa có tên)"}</span>
              {ord.unclear&&<span style={{fontSize:9,color:"#D97706",background:"#FEF3C7",padding:"2px 6px",borderRadius:4}}>⚠️</span>}
            </div>
            <div style={{fontSize:12,color:t.dm,marginTop:2}}>
              <span style={{color:t.ac,fontWeight:600}}>{ma}</span>{" · "}<span style={{color:"#60A5FA"}}>{sz}</span>{" · "}<span>{cl}</span>{" · "}<span style={{color:"#16A34A",fontWeight:600}}>x{sl}</span>
            </div>
            {ord.ghi_chu&&<div style={{fontSize:10,color:"#D97706",marginTop:2}}>📝 {ord.ghi_chu}</div>}
          </div>
        </div>
        {selected[i]&&<div style={{padding:"0 12px 10px",display:"flex",flexDirection:"column",gap:6}} onClick={e=>e.stopPropagation()}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            <input value={name} onChange={e=>updateEdit(i,"ten_khach",e.target.value)} placeholder="Tên khách" style={{...inp,padding:"7px 10px",fontSize:12}}/>
            <input value={ma} onChange={e=>updateEdit(i,"ma_sp",e.target.value)} placeholder="Mã SP" style={{...inp,padding:"7px 10px",fontSize:12,fontWeight:600,color:t.ac}}/>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
            <input value={sz} onChange={e=>updateEdit(i,"size",e.target.value)} placeholder="Size" style={{...inp,padding:"7px 10px",fontSize:12}}/>
            <input value={cl} onChange={e=>updateEdit(i,"color",e.target.value)} placeholder="Màu" style={{...inp,padding:"7px 10px",fontSize:12}}/>
            <input value={sl} onChange={e=>updateEdit(i,"so_luong",e.target.value)} placeholder="SL" type="number" style={{...inp,padding:"7px 10px",fontSize:12}}/>
          </div>
          <input value={ed.link_fb||""} onChange={e=>updateEdit(i,"link_fb",e.target.value)} placeholder="🔗 Link FB" style={{...inp,padding:"7px 10px",fontSize:12}}/>
        </div>}
      </div>;})}


      <button onClick={handleAddToSheets} disabled={adding||selectedCount===0} style={{width:"100%",marginTop:10,padding:"14px 0",borderRadius:12,border:"none",background:selectedCount===0?t.bd:"#16A34A",color:"#fff",fontSize:15,fontWeight:700,cursor:selectedCount===0?"not-allowed":adding?"wait":"pointer",opacity:adding?.7:1}}>
        {adding?"⏳ Đang ghi...":`📥 Nhập ${selectedCount} đơn vào Sheets`}
      </button>

      {addResult&&<div style={{marginTop:10,padding:"12px 14px",borderRadius:10,background:addResult.fail===0?"#D1FAE5":"#FEF3C7",border:`1px solid ${addResult.fail===0?"#86EFAC":"#FDE68A"}`,color:addResult.fail===0?"#065F46":"#92400E",fontSize:13,fontWeight:600,textAlign:"center"}}>
        {addResult.fail===0?`✅ Đã nhập ${addResult.ok} đơn!`:`⚠️ ${addResult.ok}/${addResult.total} OK, ${addResult.fail} lỗi`}
      </div>}
    </div>}

    {/* Tips */}
    {!result&&!loading&&<div style={{marginTop:20,padding:14,borderRadius:12,background:t.sf,border:`1px solid ${t.bd}`}}>
      <div style={{fontSize:12,fontWeight:600,marginBottom:8,color:t.ac}}>💡 Mẹo sử dụng</div>
      <div style={{fontSize:11,color:t.dm,lineHeight:1.8}}>
        <div>• <b style={{color:t.tx}}>Ctrl+V</b> paste screenshot bất kỳ lúc nào</div>
        <div>• Gõ <b style={{color:t.tx}}>mã SP bài đăng</b> ở trên nếu khách không ghi mã</div>
        <div>• Chụp <b style={{color:t.tx}}>cả phần comment</b> FB — AI nhận nhiều khách cùng lúc</div>
        <div>• Đơn <span style={{color:"#D97706"}}>⚠️ Chưa chắc</span> → kiểm tra trước</div>
        <div>• Điền <b style={{color:t.tx}}>Link FB</b> cho 1 đơn → tự fill hết đơn cùng khách</div>
      </div>
    </div>}
  </div>;
}

function LoginScreen({onLogin,t}){
  const [pw,setPw]=useState("");const [err,setErr]=useState(false);const [checking,setChecking]=useState(false);
  const go=async()=>{
    if(!pw||checking)return;setChecking(true);
    try{
      const r=await fetch(API,{headers:{"x-api-key":pw}});
      const j=await r.json();
      if(r.status===401||j.error==="Unauthorized"){setErr(true);setTimeout(()=>setErr(false),2000);setChecking(false);return;}
      API_KEY=pw;localStorage.setItem("dt_api_key",pw);onLogin();
    }catch(e){setErr(true);setTimeout(()=>setErr(false),2000);}
    setChecking(false);
  };
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:t.bg}}>
    <div style={{background:t.sf,borderRadius:24,padding:"48px 40px",width:380,maxWidth:"90vw",boxShadow:"0 20px 60px rgba(0,0,0,.08)",textAlign:"center",border:`1px solid ${t.bd}`}}>
      <div style={{fontSize:48,marginBottom:8}}>🌸</div><h1 style={{fontSize:24,fontWeight:800,color:t.tx,marginBottom:4}}>Dream Team</h1>
      <p style={{color:t.dm,fontSize:13,marginBottom:28}}>Đăng nhập</p>
      <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="Mật khẩu..." autoFocus
        style={{width:"100%",padding:"14px 18px",borderRadius:12,border:`2px solid ${err?"#EF4444":t.bd}`,fontSize:15,background:t.inp,color:t.tx,textAlign:"center",letterSpacing:2}}/>
      {err&&<p style={{color:"#EF4444",fontSize:12,marginTop:8}}>Sai!</p>}
      <button onClick={go} style={{width:"100%",padding:14,borderRadius:12,border:"none",background:"linear-gradient(135deg,#7C3AED,#E8567F)",color:"#fff",fontSize:15,fontWeight:700,cursor:"pointer",marginTop:16}}>Đăng nhập</button>
    </div>
  </div>;
}

root.render(<App />);
