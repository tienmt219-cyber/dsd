<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const API = "/api/dreamteam";
let API_KEY = localStorage.getItem("dt_api_key") || "";
const BANK_DEFAULT = "🇻🇳 STK Việt Nam:\nNgân hàng: Techcombank\nSTK: 8109030991196\nTên: TRINH THI PHUONG\n\n💜 PayPay: 09030991196";
const ST = ["CHƯA ĐẶT","Chờ hàng","Đang ship","Về kho","Đã gửi"];
const SC = {"CHƯA ĐẶT":"#94A3B8","Chờ hàng":"#D97706","Đang ship":"#7C3AED","Về kho":"#0D9488","Đã gửi":"#16A34A","Đã xoá":"#DC2626"};
// ★ Chi phí cố định/SP (JPY) — sửa ở đây khi thay đổi
const SHIP_GZ = 100;  // Ship GZ→JP per item
const BOSS_PER_ITEM = 80;  // ¥200/đơn ÷ ~2.5 món = ¥80/món
const SIZES = ["S","M","L","XL","2XL","3XL","FZ","35","36","37","38","39","40"];
const COLORS = ["ĐEN","TRẮNG","NÂU","HỒNG","XÁM","XANH THAN","XANH NHẠT","BE","ĐỎ","TÍM","VÀNG"];
const fmt = n => Number(n||0).toLocaleString("vi-VN");
const daysAgo = d => { const dt=new Date(d); return isNaN(dt)?0:Math.floor((Date.now()-dt)/864e5); };
// ★ Avatar: màu unique theo tên+fb
const AVT_COLORS=["#7C3AED","#E8567F","#D97706","#0D9488"];
const hashStr=s=>{let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h)+s.charCodeAt(i);return Math.abs(h);};
const getInitials=name=>{const p=String(name||"").trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():String(name||"X").slice(0,2).toUpperCase();};
// ★ Avatar: cùng màu tím chủ đạo, CHỈ đổi màu khi trùng tên
const Avatar=({name,fb,size,dup})=>{
  const s=size||28;
  const color=dup?AVT_COLORS[hashStr(String(fb||""))%AVT_COLORS.length]:"#7C3AED";
  return <div style={{width:s,height:s,borderRadius:"50%",background:color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:s*0.38,fontWeight:700,color:"#fff",flexShrink:0,letterSpacing:-0.5}}>{getInitials(name)}</div>;
};
// ★ cleanFB: clean link để lưu full URL (hiển thị cho user)
const cleanFB = url => {
  try {
    const u = new URL(url);
    if (u.pathname === "/profile.php" && u.searchParams.has("id")) {
      return u.origin + "/profile.php?id=" + u.searchParams.get("id");
    }
    return u.origin + u.pathname;
  } catch(e) { return url; }
};
// ★ normalizeFB: ra identifier UNIQUE của khách, bỏ mọi khác biệt về URL format
// "https://www.facebook.com/abc/" → "abc"
// "https://m.facebook.com/abc?ref=xyz" → "abc"
// "https://facebook.com/profile.php?id=100012345" → "id:100012345"
// "" / null / invalid → ""
// CRITICAL: đây là khoá để match khách. 2 link trỏ cùng người → phải ra cùng output.
const normalizeFB = url => {
  if(!url) return "";
  try {
    const u = new URL(String(url).trim());
    if (u.pathname === "/profile.php" && u.searchParams.has("id")) {
      return "id:" + u.searchParams.get("id").trim();
    }
    // Lấy phần cuối pathname, bỏ slash + case-insensitive
    let p = u.pathname.replace(/^\/+|\/+$/g, "");
    // FB đôi khi có /people/Name/id, lấy phần sau cùng
    const parts = p.split("/").filter(Boolean);
    if(parts.length === 0) return "";
    return parts[parts.length - 1].toLowerCase();
  } catch(e) {
    // Không parse được URL — fallback: coi như là username đã normalize
    return String(url).trim().toLowerCase();
  }
};
// ★ FB short: hiện phần cuối link FB để phân biệt trùng tên
const fbShort = url => {
  if(!url)return "";
  const s=String(url).replace("https://www.facebook.com/","").replace("https://m.facebook.com/","");
  if(s.startsWith("profile.php?id="))return "#"+s.replace("profile.php?id=","").slice(-4);
  return s.split("?")[0].slice(0,8);
};
// ★ normName: chuẩn hoá tên khách — trim + collapse whitespace + NFC unicode
// Tránh bug: "Trang Nguyen " vs "Trang Nguyen" vs "Trang  Nguyen" được coi là cùng 1 người
const normName = s => String(s||"").normalize("NFC").replace(/\s+/g," ").trim();
// ★ getAddr: lookup địa chỉ ưu tiên match name+normalizeFB(fb)
// Tránh bug: 2 link FB trỏ cùng người (vd facebook.com/abc vs m.facebook.com/abc) phải match
// Trả về: {postal,pref,city,street,phone,fb} hoặc null
const getAddr = (addrs, name, fb) => {
  if(!addrs||!name) return null;
  const n=normName(name);
  const fbKey=normalizeFB(fb);
  // Ưu tiên 1: composite key name|normalizedFB (chính xác nhất)
  if(fbKey && addrs[n+"|"+fbKey]) return addrs[n+"|"+fbKey];
  // Ưu tiên 2: chỉ match theo normalizedFB (không cần tên — khách đổi tên FB vẫn match)
  if(fbKey && addrs["fb:"+fbKey]) return addrs["fb:"+fbKey];
  // Ưu tiên 3: plain name (data cũ chưa có fb)
  return addrs[n] || null;
};
const LT={bg:"#F8FAFC",sf:"#fff",tx:"#1E293B",dm:"#94A3B8",bd:"#EAEDF3",inp:"#F8FAFC",ac:"#7C3AED",ab:"#F3EEFF",pk:"#E8567F"};
const DK={bg:"#0F172A",sf:"#1E293B",tx:"#F1F5F9",dm:"#64748B",bd:"#334155",inp:"#1E293B",ac:"#A78BFA",ab:"#1E1B4B",pk:"#F472B6"};

function copyText(text){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text);return;}
  const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;left:-9999px";document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
}

async function GET(){
  for(let retry=0;retry<2;retry++){
    const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);
    try{const r=await fetch(API,{signal:c.signal,headers:{"x-api-key":API_KEY}});clearTimeout(t);const j=await r.json();if(r.status===401){API_KEY="";localStorage.removeItem("dt_api_key");throw new Error("AUTH");}return j;}
    catch(e){clearTimeout(t);if(e.message==="AUTH")throw e;if(retry===0)continue;throw new Error("Kết nối chậm — bấm 🔄");}
  }
}
async function POST(b){
  for(let retry=0;retry<2;retry++){
    const c=new AbortController();const t=setTimeout(()=>c.abort(),10000);
    try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-api-key":API_KEY},body:JSON.stringify(b),signal:c.signal});clearTimeout(t);const j=await r.json();if(r.status===401){API_KEY="";localStorage.removeItem("dt_api_key");throw new Error("Phiên hết hạn — reload trang");}return j;}
    catch(e){clearTimeout(t);if(e.message&&e.message.includes("hết hạn"))throw e;if(retry<1){await new Promise(r=>setTimeout(r,1000));continue;}throw new Error("Kết nối chậm — thử lại");}
  }
}

function Modal({open,onClose,title,children,t}){
  if(!open)return null;
  return <div onClick={onClose} className="dt-overlay" style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",backdropFilter:"blur(4px)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} className="dt-pop" style={{background:t.sf,borderRadius:20,width:"100%",maxWidth:520,maxHeight:"90vh",overflow:"auto",border:`1px solid ${t.bd}`,boxShadow:"0 20px 60px rgba(0,0,0,.25)"}}>
      <div style={{padding:"14px 20px",borderBottom:`1px solid ${t.bd}`,display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,background:t.sf,borderRadius:"20px 20px 0 0",zIndex:2}}>
        <h3 style={{margin:0,fontSize:15,fontWeight:700,color:t.tx}}>{title}</h3>
        <button onClick={onClose} style={{width:28,height:28,borderRadius:8,border:"none",background:t.bd,cursor:"pointer",fontSize:13,color:t.dm}}>✕</button>
      </div>
      <div style={{padding:"16px 20px"}}>{children}</div>
    </div>
  </div>;
}

function EditForm({order,catalog,safePost,onDone,t,msg}){
  const o=order;
  const norm=v=>String(v||"").replace(/\.0$/,"").trim().toUpperCase();
  const str=v=>String(v==null?"":v).trim();
  const [f,setF]=useState({tenSp:str(o["Tên Sp"]),maSP:str(o["Mã SP"]),size:str(o["SIZE"]),color:str(o["COLOR"]),soLuong:str(o["Số lượng"]||1),giaSp:str(o["Giá sp"]||0),linkFb:str(o["Link fb"])});
  const inp={padding:"10px 14px",border:`1.5px solid ${t.bd}`,borderRadius:10,fontSize:13,background:t.inp,color:t.tx,width:"100%",fontFamily:"inherit"};
  const onMaChange=v=>{
    setF(p=>({...p,maSP:v}));
    const cat=catalog.find(c=>norm(c["Mã SP"])===norm(v));
    if(cat)setF(p=>({...p,maSP:v,tenSp:cat["Tên SP"]||p.tenSp,giaSp:String(cat["Giá bán"]||p.giaSp)}));
  };
  const doSave=async()=>{
    const fields={};
    if(f.tenSp!==str(o["Tên Sp"]))fields.tenSp=f.tenSp;
    if(f.maSP!==str(o["Mã SP"]))fields.maSP=f.maSP;
    if(f.size!==str(o["SIZE"]))fields.size=f.size;
    if(f.color!==str(o["COLOR"]))fields.color=f.color;
    if(str(f.soLuong)!==str(o["Số lượng"]))fields.soLuong=Number(f.soLuong)||1;
    if(str(f.giaSp)!==str(o["Giá sp"]))fields.giaSp=Number(f.giaSp)||0;
    if(f.linkFb!==str(o["Link fb"]))fields.linkFb=f.linkFb;
    if(!Object.keys(fields).length){msg("ℹ️ Chưa thay đổi gì");onDone();return;}
    await safePost({action:"editOrder",rowIndex:o._rowIndex,fields,verify:{tenKhach:str(o["Tên khách"]),maSP:str(o["Mã SP"])}},`✅ Sửa ${Object.keys(fields).join(", ")} → ${o["Tên khách"]}`);
    onDone();
  };
  return <div>
    <div style={{background:t.bg,borderRadius:8,padding:10,marginBottom:10,fontSize:12,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><b style={{color:t.tx}}>{o["Tên khách"]}</b> · <span style={{color:SC[o["TRẠNG THÁI"]]||t.dm}}>{o["TRẠNG THÁI"]}</span> · {String(o["NGÀY OD"]||"").slice(0,10)}</div>
      {o["Link fb"]&&<button onClick={()=>window.open(o["Link fb"],"_blank")} style={{border:"none",background:t.ab,borderRadius:6,padding:"3px 8px",fontSize:10,color:t.ac,cursor:"pointer"}}>🔗 FB</button>}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:8,marginBottom:8}}>
      <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Mã SP</label><input value={f.maSP} onChange={e=>onMaChange(e.target.value)} style={inp}/></div>
      <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Tên SP</label><input value={f.tenSp} onChange={e=>setF({...f,tenSp:e.target.value})} style={inp}/></div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8,marginBottom:6}}>
      <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Size</label><select value={f.size} onChange={e=>setF({...f,size:e.target.value})} style={inp}><option value="">(chọn)</option>{f.size&&!SIZES.includes(f.size)&&<option key={f.size} value={f.size}>{f.size}</option>}{SIZES.map(s=><option key={s}>{s}</option>)}</select></div>
      <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Màu</label><input value={f.color} onChange={e=>setF({...f,color:e.target.value})} style={inp}/></div>
      <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>SL</label><input value={f.soLuong} onChange={e=>setF({...f,soLuong:e.target.value})} type="number" min="1" style={inp}/></div>
      <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Giá ¥</label><input value={f.giaSp} onChange={e=>setF({...f,giaSp:e.target.value})} type="number" style={inp}/></div>
    </div>
    <div style={{display:"flex",flexWrap:"wrap",gap:3,marginBottom:8}}>
      {COLORS.map(c=><button key={c} onClick={()=>setF({...f,color:c})} style={{padding:"3px 7px",borderRadius:6,border:`1.5px solid ${f.color===c?t.ac:t.bd}`,background:f.color===c?t.ab:t.sf,color:f.color===c?t.ac:t.dm,fontSize:9,fontWeight:600,cursor:"pointer"}}>{c}</button>)}
    </div>
    <div style={{marginBottom:10}}><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Link FB</label><input value={f.linkFb} onChange={e=>setF({...f,linkFb:e.target.value})} onBlur={e=>setF({...f,linkFb:cleanFB(e.target.value)})} style={inp}/></div>
    <div style={{display:"flex",gap:8}}>
      <button onClick={onDone} style={{flex:1,padding:12,borderRadius:12,border:`1px solid ${t.bd}`,background:t.sf,color:t.dm,fontSize:14,fontWeight:700,cursor:"pointer"}}>Huỷ</button>
      <button onClick={doSave} style={{flex:2,padding:12,borderRadius:12,border:"none",background:"linear-gradient(135deg,#7C3AED,#E8567F)",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>💾 Lưu thay đổi</button>
    </div>
  </div>;
}

function AddForm({orders,catalog,addrs,surplusData,safePost,onAdd,t}){
  const [d,setD]=useState({name:"",sp:"",ma:"",sz:"S",cl:"",sl:"1",gia:"",fb:"",postal:"",pref:"",city:"",street:"",phone:""});
  const [sug,setSug]=useState(false);const [addrOpen,setAddrOpen]=useState(false);const [zipLoading,setZipLoading]=useState(false);
  // known: gom đơn theo customerId = fbKey (ưu tiên) HOẶC name (fallback cho data cũ không FB)
  // → nhiều tên nhưng cùng FB = 1 khách; không có FB thì fallback theo tên
  const known=useMemo(()=>{
    const m={};  // key: customerId → {name(latest), allNames:{}, fb, count, lastDate, lastSP, rev, noFb}
    orders.forEach(o=>{
      const n=normName(o["Tên khách"]);if(!n)return;
      const fbRaw=String(o["Link fb"]||"").trim();
      const fbKey=normalizeFB(fbRaw);
      const custId=fbKey?"fb:"+fbKey:"name:"+n;  // ★ customerId
      const date=String(o["NGÀY OD"]||"").slice(0,10);
      const sp=String(o["Mã SP"]||"");
      const rev=(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0);
      if(!m[custId])m[custId]={name:n,allNames:{},fb:fbRaw,fbKey,count:0,lastDate:"",lastSP:"",rev:0,noFb:!fbKey};
      m[custId].count++;m[custId].rev+=rev;
      m[custId].allNames[n]=(m[custId].allNames[n]||0)+1;
      // Tên của đơn gần nhất thắng
      if(date>m[custId].lastDate){m[custId].lastDate=date;m[custId].lastSP=sp;m[custId].name=n;if(fbRaw)m[custId].fb=fbRaw;}
    });
    const result=[];
    Object.entries(m).forEach(([custId,v])=>{
      const tier=v.count>=10?"👑":v.count>=5?"⭐":v.count>=2?"🔄":"🆕";
      const ago=v.lastDate?daysAgo(v.lastDate):999;
      const agoTxt=ago===0?"Hôm nay":ago===1?"Hôm qua":ago<=7?`${ago} ngày trước`:ago<=30?`${Math.floor(ago/7)} tuần trước`:`${Math.floor(ago/30)} tháng trước`;
      const addr=getAddr(addrs,v.name,v.fb);
      const city=addr?String(addr.city||addr.pref||"").slice(0,6):"";
      // Tên khác cho khách này (VD: từng nhập "Hà Nguyễn" rồi "Nguyễn Thị Hà" cùng FB)
      const otherNames=Object.keys(v.allNames).filter(nm=>nm!==v.name);
      result.push({
        custId,
        name:v.name,
        fb:v.fb,
        fbKey:v.fbKey,
        count:v.count,
        rev:v.rev,
        lastDate:v.lastDate,
        lastSP:v.lastSP,
        tier,ago,agoTxt,city,
        otherNames,             // mảng tên khác đã từng dùng
        noFb:v.noFb             // true = chưa có FB (cảnh báo đỏ)
      });
    });
    result.sort((a,b)=>a.ago-b.ago);
    return result;
  },[orders,addrs]);
  // Match theo tên hiện tại HOẶC các tên cũ đã từng dùng
  const matches=d.name.length>0?known.filter(c=>{
    const q=d.name.toLowerCase();
    if(c.name.toLowerCase().includes(q))return true;
    return c.otherNames.some(nm=>nm.toLowerCase().includes(q));
  }).slice(0,8):[];
  const norm=v=>String(v||"").replace(/\.0$/,"").trim().toUpperCase();
  const catMatch=useMemo(()=>{if(!d.ma)return null;return catalog.find(c=>norm(c["Mã SP"])===norm(d.ma));},[d.ma,catalog]);
  const surplusMatch=useMemo(()=>{if(!d.ma||!surplusData)return null;return surplusData.find(s=>norm(s.ma)===norm(d.ma)&&(!d.sz||norm(s.sz)===norm(d.sz))&&(!d.cl||norm(s.cl)===norm(d.cl)));},[d.ma,d.sz,d.cl,surplusData]);
  const onMaChange=e=>{
    const ma=e.target.value;
    const found=catalog.find(c=>norm(c["Mã SP"])===norm(ma));
    if(found)setD(p=>({...p,ma,sp:found["Tên SP"]||p.sp,gia:String(found["Giá bán"]||p.gia)}));
    else setD(p=>({...p,ma}));
  };
  // ★ Chọn khách cũ → auto-fill address (match đúng bằng name+fb)
  const selectCustomer=(c)=>{
    const a=getAddr(addrs,c.name,c.fb)||{};
    setD(p=>({...p,name:c.name,fb:c.fb,postal:a.postal||"",pref:a.pref||"",city:a.city||"",street:a.street||"",phone:a.phone||""}));
    setSug(false);
    if(a.postal)setAddrOpen(true);
  };
  // ★ Mã bưu điện → auto fill kanji
  const lookupZip=async(zip)=>{
    const clean=zip.replace(/[^0-9]/g,"");
    if(clean.length!==7)return;
    setZipLoading(true);
    try{
      const r=await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+clean);
      const j=await r.json();
      if(j.results&&j.results[0]){
        const a=j.results[0];
        setD(p=>({...p,postal:clean.slice(0,3)+"-"+clean.slice(3),pref:a.address1||"",city:a.address2||"",street:a.address3||p.street}));
      }
    }catch(e){}
    setZipLoading(false);
  };
  const hasAddr=d.postal||d.pref||d.city;
  const inp={padding:"10px 14px",border:`1.5px solid ${t.bd}`,borderRadius:10,fontSize:13,background:t.inp,color:t.tx,width:"100%",fontFamily:"inherit"};
  const inpS={padding:"8px 10px",border:`1.5px solid ${t.bd}`,borderRadius:8,fontSize:12,background:t.inp,color:t.tx,width:"100%",fontFamily:"inherit"};
  // ★ Tạo đơn + lưu địa chỉ
  // ★ Multi-add cart
  const [addCount,setAddCount]=useState(0);
  const [cart,setCart]=useState([]);
  const addToCart=()=>{
    if(!d.name||!d.ma)return;
    const dup=orders.find(o=>String(o["Tên khách"]||"").trim()===d.name.trim()&&norm(o["Mã SP"])===norm(d.ma)&&norm(o["SIZE"])===norm(d.sz)&&norm(o["COLOR"])===norm(d.cl)&&o["TRẠNG THÁI"]!=="Đã xoá"&&o["TRẠNG THÁI"]!=="Lưu trữ");
    if(dup&&!confirm(`⚠️ ${d.name} đã có đơn ${d.ma} ${d.sz} ${d.cl} — vẫn thêm?`))return;
    setCart(c=>[...c,{tenKhach:d.name,tenSp:d.sp,maSP:d.ma,size:d.sz,color:d.cl,soLuong:Number(d.sl)||1,giaSp:Number(d.gia)||0,linkFb:d.fb}]);

  };
  const doAddAll=async()=>{
    const items=cart.length>0?cart:[{tenKhach:d.name,tenSp:d.sp,maSP:d.ma,size:d.sz,color:d.cl,soLuong:Number(d.sl)||1,giaSp:Number(d.gia)||0,linkFb:d.fb}];

    {d.name&&d.ma&&(()=>{const dup=orders.filter(o=>String(o["Tên khách"]||"").trim()===d.name.trim()&&norm(o["Mã SP"])===norm(d.ma)&&o["TRẠNG THÁI"]!=="Đã xoá"&&o["TRẠNG THÁI"]!=="Lưu trữ");return dup.length>0?<div style={{background:"#FEE2E2",borderRadius:8,padding:"6px 10px",marginBottom:8,fontSize:11,color:"#991B1B"}}>⚠️ {d.name} đã có {dup.length} đơn {d.ma} — trùng?</div>:null;})()}

    <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:14}}>

    <div style={{display:"flex",gap:6}}>

  </>;

function exportCSV(orders){
  const h=["Tên khách","Tên Sp","Mã SP","SIZE","COLOR","Số lượng","Giá sp","NGÀY OD","TRẠNG THÁI"];
  const csv="\uFEFF"+[h.join(","),...orders.map(o=>h.map(k=>`"${String(o[k]||"").replace(/"/g,'""')}"`).join(","))].join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="dream-team-"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

// ★ BOSS CSV Export — 44 cột, gom theo khách = 1 đơn
function removeAccents(str){return String(str||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D");}

// Rút gọn màu → chữ cái đầu, trùng thì thêm ký tự
function colorCode(color){
  const c=removeAccents(String(color||"")).trim().toUpperCase();
  if(!c)return "";
  const MAP={
    "DEN":"D","TRANG":"T","DO":"DO","XANH":"X",
    "XANH DUONG":"XD","XANH LA":"XL","XANH REU":"XR","XANH NAVY":"XN","XANH THAN":"XT",
    "HONG":"H","TIM":"TI","XAM":"XA","NAU":"N","BE":"B","KEM":"B",
    "VANG":"V","CAM":"CA","NUDE":"NU",
    "TRANG KEM":"TK","TRANG NGOC TRAI":"TN",
    "DEN THAN":"DT","DO DO":"DD","DO MAN":"DM",
    "GHI":"G","BAC":"BA","CAFE":"CF","REU":"R",
    "OLI":"OL","OLIVE":"OL","CAMEL":"CM","CHOCOLATE":"CH",
    "BLACK":"D","WHITE":"T","RED":"DO","BLUE":"X","PINK":"H",
    "GREY":"XA","GRAY":"XA","BROWN":"N","BEIGE":"B","GREEN":"XL",
    "NAVY":"XN","PURPLE":"TI","YELLOW":"V","ORANGE":"CA",
  };
  if(MAP[c])return MAP[c];
  return c.charAt(0);
}

function exportBOSS(items, addrs) {
  const SHOP_ID = "75086";
  const ORDER_PREFIX = "50000";
  const DEFAULT_PHONE = "080-8035-9847";
  const hdr="モール注文番号,モール注文日時,ショップID,店舗様用メモ,注文者氏名,注文者国名,注文者郵便番号,都道府県,市区町村,町名・番地以降,注文者メールアドレス,注文者電話番号,決済方法区分,注文備考,カスタマー備考,送付先氏名,送付先国名,送付先郵便番号,送付先都道府県,送付先市区町村,送付先町名・番地以降,送付先電話番号,配送方法,お届け指定日,お届け指定時間帯,配送サービス種別,配送備考,倉庫備考,配送料,配送料税率,決済手数料,決済手数料税率,ラッピング手数料,ラッピング手数料税率,ポイント利用額,クーポン利用額,ギフト備考,SKUコード,商品名,注文個数,商品単価,消費税,税率,税込別";
  const today=new Date().toISOString().slice(0,10).replace(/-/g,"");

  // Format SĐT: 08012345678 → 080-1234-5678
  const fmtPhone=(raw)=>{
    if(!raw)return DEFAULT_PHONE;
    let p=String(raw).replace(/[^0-9]/g,"");
    if(!p)return DEFAULT_PHONE;
    if(p.length===10) p="0"+p; // 8012345678 → 08012345678
    if(p.length===11) return p.slice(0,3)+"-"+p.slice(3,7)+"-"+p.slice(7);
    return String(raw); // giữ nguyên nếu format lạ
  };

  // Auto-fill pref từ postal (đơn giản, dùng cache đã có)
  const fillPref=(addr)=>{
    if(addr.pref)return addr.pref;
    const clean=(addr.postal||"").replace(/[^0-9]/g,"");
    if(clean.length===7&&zipPrefCache[clean])return zipPrefCache[clean].pref||"";
    return "";
  };

  const byCust={};
  items.forEach(o=>{
    const name=String(o["Tên khách"]||"").trim();
    const fb=String(o["Link fb"]||"").trim();
    const key=name+"|"+fb;  // ★ group by name+fb để tách khách trùng tên
    if(!byCust[key])byCust[key]={name,fb,list:[]};
    byCust[key].list.push(o);
  });
  let seq=1;
  const rows=[];
  Object.values(byCust).forEach(({name,fb,list})=>{
    const orderId=ORDER_PREFIX+"-"+today+"-"+(String(seq++).padStart(5,"0"));
    const addr=getAddr(addrs,name,fb)||{};
    const nameEN=removeAccents(name);
    const phone=fmtPhone(addr.phone);
    const pref=fillPref(addr);
    list.forEach(o=>{
      const sku=removeAccents(String(o["Mã SP"]||"")).trim();
      const baseName=removeAccents(String(o["Tên Sp"]||"")).trim();
      const sz=removeAccents(String(o["SIZE"]||"")).trim().toUpperCase();
      const cl=removeAccents(String(o["COLOR"]||"")).trim();
      const clCode=colorCode(o["COLOR"]||"");
      const spName=[baseName,sz,cl].filter(Boolean).join(" ");
      const skuFull=[sku,clCode,sz].filter(Boolean).join("-");
      const qty=String(o["Số lượng"]||1);
      const price=String(o["Giá sp"]||0);
      rows.push([
        orderId,           // 1: モール注文番号
        "",                // 2: モール注文日時 → TRỐNG
        SHOP_ID,           // 3: ショップID → 75086
        "",                // 4: 店舗様用メモ
        nameEN,            // 5: 注文者氏名
        "",                // 6: 注文者国名 → TRỐNG
        addr.postal||"",   // 7: 注文者郵便番号
        pref,              // 8: 都道府県 (auto-fill)
        addr.city||"",     // 9: 市区町村
        addr.street||"",   // 10: 町名・番地以降
        "",                // 11: メールアドレス
        phone,             // 12: 電話番号 (format + default)
        "代金引換",         // 13: 決済方法区分
        "",                // 14: 注文備考
        "",                // 15: カスタマー備考
        nameEN,            // 16: 送付先氏名
        "",                // 17: 送付先国名 → TRỐNG
        addr.postal||"",   // 18: 送付先郵便番号
        pref,              // 19: 送付先都道府県 (auto-fill)
        addr.city||"",     // 20: 送付先市区町村
        addr.street||"",   // 21: 送付先町名・番地以降
        phone,             // 22: 送付先電話番号 (format + default)
        "宅配便",           // 23: 配送方法
        "","","","","",    // 24-28: trống
        "","","","","","","","","",  // 29-37: trống
        skuFull,           // 38: SKUコード → MÃ SP-MÀU-SIZE
        spName,            // 39: 商品名 → TÊN + SIZE + MÀU riêng
        qty,               // 40: 注文個数
        price,             // 41: 商品単価
        "","",""           // 42-44: trống
      ].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(","));
    });
  });
  const csv="\uFEFF"+hdr+"\r\n"+rows.join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="BOSS-"+today+".csv";a.click();
  return Object.keys(byCust).length;
}

// ═══ INLINE EDIT CELL ═══
function InlineCell({value,field,rowIndex,type,options,safePost,busy,style,catalog,t,onSave}){
  const [editing,setEditing]=useState(false);
  const [val,setVal]=useState(String(value??""));
  const ref=useRef(null);
  useEffect(()=>{if(!editing)setVal(String(value??""));},[value,editing]);
  useEffect(()=>{if(editing&&ref.current){ref.current.focus();if(type!=="select")ref.current.select();}});
  const save=()=>{
    setEditing(false);
    const oldVal=String(value??"");
    if(val===oldVal)return;
    if(onSave){onSave(field,val);return;}
    const fields={};
    if(field==="soLuong")fields.soLuong=Number(val)||1;
    else if(field==="giaSp")fields.giaSp=Number(val)||0;
    else fields[field]=val;
    if(field==="maSP"&&catalog){const cat=catalog.find(c=>String(c["Mã SP"]||"").trim().toUpperCase()===val.trim().toUpperCase());if(cat){fields.tenSp=cat["Tên SP"]||"";fields.giaSp=Number(cat["Giá bán"])||0;}}
    safePost({action:"editOrder",rowIndex,fields},"✅ Đã sửa");
  };
  const onKey=e=>{if(e.key==="Enter")save();if(e.key==="Escape"){setVal(String(value??""));setEditing(false);}};
  if(!editing)return <td style={{...style,cursor:"pointer"}} onClick={()=>{if(!busy)setEditing(true);}}>{type==="price"?"¥"+Number(value||0).toLocaleString("vi-VN"):String(value??"")}</td>;
  const is={padding:"2px 4px",border:`2px solid ${t.ac}`,borderRadius:4,fontSize:12,background:t.sf,color:t.tx,width:"100%",fontFamily:"inherit",outline:"none"};
  if(type==="select")return <td style={style}><select ref={ref} value={val} onChange={e=>{setVal(e.target.value);setTimeout(()=>{if(onSave){onSave(field,e.target.value);setEditing(false);return;}const fields={};fields[field]=e.target.value;safePost({action:"editOrder",rowIndex,fields},"✅ Đã sửa");setEditing(false);},0);}} onBlur={()=>setEditing(false)} style={is}>{(options||[]).map(o=><option key={o}>{o}</option>)}{val&&!options?.includes(val)&&<option>{val}</option>}</select></td>;
  return <td style={style}><input ref={ref} value={val} onChange={e=>setVal(e.target.value)} onBlur={save} onKeyDown={onKey} type={type==="number"||type==="price"?"number":"text"} style={is}/></td>;
}

// ═══ MAIN ═══
function App(){
  const [auth,setAuth]=useState(!!API_KEY);const [dark,setDark]=useState(()=>{try{return localStorage.getItem("dt_dark")==="1"}catch(e){return false}});const [tab,setTab]=useState("dash");const [dashPeriod,setDashPeriod]=useState("all");
  const toggleDark=()=>{const v=!dark;setDark(v);try{localStorage.setItem("dt_dark",v?"1":"0")}catch(e){}};
  const [orders,setOrders]=useState([]);const [stock,setStock]=useState([]);const [catalog,setCatalog]=useState([]);const [addrs,setAddrs]=useState({});const [surplus,setSurplus]=useState([]);const [emsHistory,setEmsHistory]=useState([]);
  const [loading,setLoading]=useState(true);const [busy,setBusy]=useState(false);const [toast,setToast]=useState(null);const [lastSync,setLastSync]=useState(null);
  const [mAdd,setMAdd]=useState(false);const [mCust,setMCust]=useState(null);const [mEdit,setMEdit]=useState(null);
  const [search,setSearch]=useState("");const [filt,setFilt]=useState("Tất cả");const [custFilter,setCustFilter]=useState("");
  const [sel,setSel]=useState(new Set());const [shipSel,setShipSel]=useState(new Set());const [sortBy,setSortBy]=useState("date");const [sortDir,setSortDir]=useState("desc");const [ckView,setCkView]=useState("chua");
  const ckOverrides=useRef(null);
  if(!ckOverrides.current){try{ckOverrides.current=new Map(JSON.parse(localStorage.getItem("dt_ck_overrides")||"[]"));}catch(e){ckOverrides.current=new Map();}}

  const saveBank=v=>{setBank(v);try{localStorage.setItem("dt_bank",v)}catch(e){}};
  const [bossDraft,setBossDraft]=useState(()=>{try{const d=localStorage.getItem("dt_boss_draft");return d?JSON.parse(d):[]}catch(e){return []}});
  const saveBossDraft=d=>{setBossDraft(d);try{localStorage.setItem("dt_boss_draft",JSON.stringify(d))}catch(e){}};
  const addToBossDraft=(items)=>{
    const exist=new Set(bossDraft.map(o=>o._rowIndex));
    const newItems=items.filter(o=>!exist.has(o._rowIndex));
    if(!newItems.length){msg("⚠️ Các đơn này đã có trong draft rồi");return 0;}
    const merged=[...bossDraft,...newItems.map(o=>({...o,_addedAt:new Date().toISOString()}))];
    saveBossDraft(merged);
    return newItems.length;
  };
  const removeFromBossDraft=(indices)=>{const s=new Set(indices);saveBossDraft(bossDraft.filter(o=>!s.has(o._rowIndex)));};
  const clearBossDraft=()=>saveBossDraft([]);
  const [draftExported,setDraftExported]=useState(false);
  const [draftAddrStatus,setDraftAddrStatus]=useState({});
  const validateDraftAddrs=async()=>{
    // ★ Dedupe theo name+fb để xử lý khách trùng tên riêng biệt
    const custKeys=[...new Set(bossDraft.map(o=>{
      const n=String(o["Tên khách"]||"").trim();
      const f=String(o["Link fb"]||"").trim();
      return n+"\u0001"+f;  // separator đặc biệt
    }))];
    const status={};
    for(const key of custKeys){
      const [name,fb]=key.split("\u0001");
      const a=getAddr(addrs,name,fb)||{};
      const postal=(a.postal||"").replace(/[^0-9]/g,"");
      if(!postal||postal.length!==7){status[key]={ok:false,msg:"❌ Thiếu 〒"};continue;}
      try{
        const r=await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+postal);
        const j=await r.json();
        if(j.results&&j.results[0]){
          const z=j.results[0];
          const needFix=!a.pref||!a.city;
          const mismatch=a.pref&&a.pref!==z.address1;
          if(needFix){
            const newCity=z.address2||a.city;
            const oldCity=a.city||"";
            let newStreet=a.street||"";
            // Recalculate street from original full address
            const origFull=(a.pref||"")+(a.city||"")+(a.street||"");
            const prefCity=(z.address1||"")+newCity;
            if(origFull.startsWith(prefCity)){
              newStreet=origFull.slice(prefCity.length);
            }else if(origFull.startsWith(newCity)){
              newStreet=origFull.slice(newCity.length);
            }
            if(!newStreet&&z.address3)newStreet=z.address3;
            // ★ INTEGRITY: don't save if data would be lost
            const rebuiltLen=((z.address1||"").length+newCity.length+newStreet.length);
            const origLen=origFull.replace(/\s/g,"").length;
            if(rebuiltLen<origLen){newStreet=(a.city||"")+(a.street||"");}
            const fixed={...a,pref:z.address1||a.pref,city:newCity,street:newStreet.trim()};
            const addrKey=fb?name+"|"+fb:name;
            const newAddrs={...addrs,[addrKey]:fixed};
            setAddrs(newAddrs);
            safePost({action:"saveAddress",name,fb:fb||"",address:fixed},"");
            status[key]={ok:true,msg:`✅ Auto: ${z.address1} ${newCity} ${newStreet.slice(0,10)}...`,fixed:true};
          }else if(mismatch){
            status[key]={ok:false,msg:`⚠️ 〒→${z.address1} ≠ ${a.pref}`,suggest:z};
          }else{
            status[key]={ok:true,msg:"✅ OK"};
          }
        }else{status[key]={ok:false,msg:"❌ 〒 không tồn tại"};}
      }catch(e){status[key]={ok:false,msg:"⚠️ Lỗi check"};}
    }
    setDraftAddrStatus(status);
    const fixed=Object.values(status).filter(s=>s.fixed).length;
    const errors=Object.values(status).filter(s=>!s.ok).length;
    if(fixed)msg(`✅ Đã auto-fill ${fixed} địa chỉ`);
    if(errors)msg(`⚠️ ${errors} địa chỉ có vấn đề`);
    if(!fixed&&!errors)msg("✅ Tất cả địa chỉ OK");
  };
  const [df,setDf]=useState("");const [dt,setDt]=useState("");
  const mob=typeof window!=="undefined"&&window.innerWidth<768;
  const t=dark?DK:LT;

  const msg=useCallback(m=>{setToast(m);setTimeout(()=>setToast(null),2500);try{navigator.vibrate&&navigator.vibrate(50)}catch(e){}},[]);
  // ★ Sanitize addresses: Sheets sometimes returns Date objects as strings like "Sun Jun 01 1006 00:00:00 GMT..."
  const sanitizeAddrs=(raw)=>{
    if(!raw||typeof raw!=="object")return{};
    const isDateStr=v=>{const s=String(v||"");return /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s/.test(s)||/^\d{4}-\d{2}-\d{2}T/.test(s)||/\d{2}:\d{2}:\d{2}\s*GMT/.test(s)||/GMT[+-]\d/.test(s);};
    const cleanField=v=>isDateStr(v)?"":String(v||"");
    const clean={};
    for(const[name,addr]of Object.entries(raw)){
      clean[name]={postal:cleanField(addr.postal),pref:cleanField(addr.pref),city:cleanField(addr.city),street:cleanField(addr.street),phone:cleanField(addr.phone)};
    }
    return clean;
  };
  const sync=useCallback(d=>{if(d&&d.orders){
    let merged=d.orders;
    if(ckOverrides.current.size>0){
      merged=d.orders.map(o=>{
        const ov=ckOverrides.current.get(o._rowIndex);
        if(!ov)return o;
        if((o._note||"").includes("💰CK")){ckOverrides.current.delete(o._rowIndex);saveCkOverrides();return o;}
        return {...o,_note:ov};
      });
    }
    setOrders(merged);setStock(d.stock||[]);setCatalog(d.catalog||[]);setAddrs(sanitizeAddrs(d.addresses||{}));setSurplus(d.surplus||[]);setEmsHistory(d.emsHistory||[]);setLastSync(new Date().toLocaleTimeString("vi-VN"));}},[]);
  const load=useCallback(async s=>{if(!s)setLoading(true);try{const d=await GET();if(d.success)sync(d);}catch(e){if(!s)msg("❌ "+e.message);}if(!s)setLoading(false);},[msg,sync]);
  useEffect(()=>{if(auth)load();},[auth,load]);
  const busyRef=useRef(false);
  useEffect(()=>{busyRef.current=busy;if(busy){const t=setTimeout(()=>{setBusy(false);msg("⚠️ Quá lâu — đã mở khoá. Thử lại.");},15000);return()=>clearTimeout(t);}},[busy]);
  useEffect(()=>{if(!auth)return;const iv=setInterval(()=>{if(!busyRef.current)load(true);},60000);return()=>clearInterval(iv);},[auth,load]);
  // ★ Ctrl+N → thêm đơn, Ctrl+R → refresh, Esc → đóng modal
  useEffect(()=>{const h=e=>{if(e.ctrlKey&&e.key==="n"){e.preventDefault();setMAdd(true);}if(e.ctrlKey&&e.key==="r"){e.preventDefault();load();msg("🔄 Đang tải...");}if(e.key==="Escape"){setMAdd(false);setMCust(null);}};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[load,msg]);

  const safePost=useCallback(async(body,okMsg)=>{
    setBusy(true);setSel(new Set());setShipSel(new Set());
    let ok=false;
    try{const r=await POST(body);if(r.error){msg("❌ "+r.error);if(r.needReload)await load();}else{
      ok=true;let extra="";
      if(r.autoStatus)extra=` 🟢 Hàng dư → ${r.autoStatus}`;
      if(r.autoCount>0)extra=` 🟢 ${r.autoCount} đơn auto từ hàng dư`;
      if(r.matched>0)extra=` (${r.matched} đơn → Về kho)`;
      if(okMsg)msg(okMsg+extra);
      if(r.data){sync(r.data);}else{setBusy(false);load(true);return ok;}}}
    catch(e){msg("❌ "+e.message);load(true);}
    setBusy(false);return ok;
  },[msg,load,sync]);

  // ★ Active orders = bỏ "Đã xoá"
  const active=useMemo(()=>orders.filter(o=>{
    if(o["TRẠNG THÁI"]==="Đã xoá"||o["TRẠNG THÁI"]==="Lưu trữ")return false;
    // Đã gửi > 3 ngày → chỉ hiện ở tab Đã gửi (dùng ngày gửi thực từ _note, fallback NGÀY OD)
    if(o["TRẠNG THÁI"]==="Đã gửi"){const sentM=(o._note||"").match(/📮SENT (\d{4}-\d{2}-\d{2})/);const sentDate=sentM?sentM[1]:String(o["NGÀY OD"]||"").slice(0,10);if(daysAgo(sentDate)>3)return false;}

  // ★ Chờ gửi = "Về kho" group by khách
  const shipData=useMemo(()=>{

    const byC={};
    ready.forEach(o=>{
      const n=String(o["Tên khách"]||"").trim();if(!n)return;

    const byDate={};allValid.forEach(x=>{const d=String(x["NGÀY OD"]||"").slice(0,10);if(d)byDate[d]=(byDate[d]||0)+(Number(x["Giá sp"])||0)*Number(x["Số lượng"]||0);});
    const revChart=Object.keys(byDate).sort().slice(-7).map(d=>({l:d.slice(5),v:byDate[d]}));

    const topSP=Object.values(spM).sort((a,b)=>b.q-a.q).slice(0,5);
    const cuM={};allValid.forEach(x=>{const k=normName(String(x["Tên khách"]||""));if(!k)return;if(!cuM[k])cuM[k]={n:k,fb:String(x["Link fb"]||""),r:0};cuM[k].r+=(Number(x["Giá sp"])||0)*Number(x["Số lượng"]||0);});
    const topCust=Object.values(cuM).sort((a,b)=>b.r-a.r).slice(0,5);
    const pendingDays=allValid.filter(x=>!["Đã gửi","Đã xoá"].includes(x["TRẠNG THÁI"])).map(x=>daysAgo(String(x["NGÀY OD"]||"").slice(0,10))).filter(d=>d>0);
    const avgDays=pendingDays.length?Math.round(pendingDays.reduce((a,b)=>a+b,0)/pendingDays.length):0;

    const debtCount=allValid.filter(x=>x["TRẠNG THÁI"]==="Đã gửi"&&!(x._note||"").includes("💰CK")).length;
    return{byS,rev,profit,cust,overdue,avg:allValid.length?rev/allValid.length:0,revChart,topSP,topCust,avgDays,maxDays,total:allValid.length,debt,debtCount};
  },[orders,catalog]);

  // ★ SP sắp hết: nhiều đơn chờ nhưng ít kho

  const surplusData=useMemo(()=>{

  const lowStock=useMemo(()=>{

    return Object.entries(demand).filter(([k,v])=>v>5&&(supply[k]||0)<v*0.3).map(([k,v])=>({ma:k,need:v,have:supply[k]||0})).sort((a,b)=>b.need-a.need).slice(0,5);

      if(df){const d=String(o["NGÀY OD"]||"").slice(0,10);if(d<df)return false;}
      if(dt){const d=String(o["NGÀY OD"]||"").slice(0,10);if(d>dt)return false;}

    // ★ Sort by column

    if(sortBy==="date")list.sort((a,b)=>dir*(String(a["NGÀY OD"]||"").localeCompare(String(b["NGÀY OD"]||""))));

    else if(sortBy==="price")list.sort((a,b)=>dir*((Number(a["Giá sp"])||0)-(Number(b["Giá sp"])||0)));
    else if(sortBy==="status")list.sort((a,b)=>dir*(ST.indexOf(a["TRẠNG THÁI"])-ST.indexOf(b["TRẠNG THÁI"])));
    return list;
  },[active,filt,custFilter,search,df,dt,sortBy,sortDir]);

  // ★ Detect trùng tên (khác FB)
  const dupNames=useMemo(()=>{

    active.forEach(o=>{

  // ★ Ship selected items

    await safePost({action:"shipItems",items:data,tracking:tracking||""},`📦 Đã gửi ${items.length} món!${tracking?" 🚚 "+tracking:""}`);

  const doUnship=async(items)=>{
    const data=items.map(o=>({rowIndex:o._rowIndex,tenKhach:String(o["Tên khách"]||"").trim(),maSP:String(o["Mã SP"]||""),newStatus:"Về kho"}));
    await safePost({action:"bulkUpdateStatus",items:data},`↩ Hoàn tác ${items.length} đơn → Về kho`);
  };

  // ★ CK: optimistic + ckOverrides bảo vệ qua mọi sync/load
  const doCK=async(customerItems,customerName,customerRev)=>{
    const rowSet=new Set(customerItems.map(o=>o._rowIndex));
    const today=new Date().toISOString().slice(0,10);
    // 1. Optimistic update + localStorage backup
    customerItems.forEach(o=>{ckOverrides.current.set(o._rowIndex,(o._note||"")+" 💰CK "+today);});
    saveCkOverrides();
    setOrders(prev=>prev.map(o=>rowSet.has(o._rowIndex)?{...o,_note:(o._note||"")+" 💰CK "+today}:o));
    msg(`💰 ${customerName} đang lưu CK...`);
    // 2. Gọi API
    setBusy(true);
    try{

              </tr></thead>
              <tbody>{filtered.map(o=>{const isS=sel.has(o._rowIndex);const days=daysAgo(String(o["NGÀY OD"]||"").slice(0,10));const over=!["Đã gửi","Về kho"].includes(o["TRẠNG THÁI"])&&days>21;const dayColor=days<=7?"#16A34A":days<=21?"#D97706":"#DC2626";

                  <InlineCell value={o["Tên Sp"]} field="tenSp" rowIndex={o._rowIndex} safePost={safePost} busy={busy} catalog={catalog} t={t} style={{padding:"5px 3px",color:t.dm,fontSize:11,maxWidth:80,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}/>

                  <td style={{padding:"5px 3px"}}>{days>0&&<span style={{fontSize:9,fontWeight:700,color:["Đã gửi"].includes(o["TRẠNG THÁI"])?"#16A34A":dayColor,background:["Đã gửi"].includes(o["TRẠNG THÁI"])?"#D1FAE5":dayColor+"15",padding:"1px 5px",borderRadius:4}}>{days}d</span>}{o["TRẠNG THÁI"]==="Đã gửi"&&<span style={{fontSize:8,fontWeight:700,marginLeft:2,padding:"1px 4px",borderRadius:3,background:(o._note||"").includes("💰CK")?"#D1FAE5":"#FEE2E2",color:(o._note||"").includes("💰CK")?"#065F46":"#DC2626"}}>{(o._note||"").includes("💰CK")?"✅":"💳"}</span>}</td>
                  <td style={{padding:"5px 2px"}}><select value={o["TRẠNG THÁI"]} onChange={e=>{
                    const newSt=e.target.value;const name=String(o["Tên khách"]||"").trim();
                    safePost({action:"updateStatus",rowIndex:o._rowIndex,newStatus:newSt,verify:{tenKhach:name,maSP:String(o["Mã SP"]||"")}},`→ ${newSt}`);
                    // ★ Auto copy tin nhắn theo trạng thái
                    const msgs={"Chờ hàng":`${name} ơi em xác nhận đơn nha!\n${o["Tên Sp"]||o["Mã SP"]} ${o["SIZE"]} ${o["COLOR"]} x${o["Số lượng"]}\nGiá: ¥${fmt(o["Giá sp"])}\nHàng sẽ về trong 7-14 ngày. Về kho em báo ${name} CK nhé! 💜`,"Về kho":`${name} ơi hàng về rồi!\n${o["Tên Sp"]||o["Mã SP"]} ${o["SIZE"]} ${o["COLOR"]} x${o["Số lượng"]}\n💰 ¥${fmt(o["Giá sp"])}\n\n${bank}\nCK xong báo t nhé.`};
                    if(msgs[newSt]){copyText(msgs[newSt]);msg(`📋 Đã copy tin nhắn → ${name}`);}
                  }} disabled={busy} style={{padding:"2px 3px",borderRadius:4,border:`1px solid ${SC[o["TRẠNG THÁI"]]||t.bd}30`,background:`${SC[o["TRẠNG THÁI"]]||"#999"}10`,color:SC[o["TRẠNG THÁI"]]||t.dm,fontSize:9,fontWeight:600,cursor:"pointer"}}>{ST.map(s=><option key={s}>{s}</option>)}</select></td>
                  <td style={{padding:"5px 2px",display:"flex",gap:2}}>
                    <button onClick={()=>{copyText(`${o["Tên khách"]} | ${o["Mã SP"]} ${o["SIZE"]} ${o["COLOR"]} x${o["Số lượng"]} | ¥${fmt(o["Giá sp"])} | ${o["TRẠNG THÁI"]}`);msg("📋 Copied");}} title="Copy" style={{border:"none",background:"none",cursor:"pointer",fontSize:9}}>📋</button>
                    <button onClick={()=>setMEdit(o)} title="Sửa" style={{border:"none",background:"none",cursor:"pointer",fontSize:9}}>✏️</button>
                    <button onClick={()=>{if(!confirm("Xoá?"))return;safePost({action:"softDelete",rowIndex:o._rowIndex,verify:{tenKhach:String(o["Tên khách"]||"").trim(),maSP:String(o["Mã SP"]||"")}},"Đã xoá");}} disabled={busy} style={{border:"none",background:"none",cursor:"pointer",fontSize:9}}>🗑</button>
                  </td>
                </tr>;})}</tbody>
              <tfoot><tr style={{borderTop:`2px solid ${t.bd}`,background:t.bg}}>
                <td colSpan={2} style={{padding:"6px 4px",fontSize:10,fontWeight:700,color:t.dm}}>{filtTotals.cust} khách</td>
                <td colSpan={4} style={{padding:"6px 4px",fontSize:10,fontWeight:700,color:t.ac}}>{filtered.length} đơn</td>
                <td style={{padding:"6px 4px",fontSize:10,fontWeight:700,color:t.tx}}>{filtTotals.qty}</td>

                <td colSpan={3}/>
              </tr></tfoot>
            </table></div>
          </div>
          <div style={{fontSize:10,color:t.dm,marginTop:4}}>💡 Bấm tên = lọc · Double-click tên = sửa · Bấm ô = sửa trực tiếp · Enter = lưu · Esc = huỷ</div>
        </div>}

        {/* ★ ĐẶT GZ — gom đơn + bulk update */}
        {tab==="gz"&&<GZTab gzData={gzData} gzCounts={gzCounts} surplusData={surplusData} safePost={safePost} busy={busy} t={t} mob={mob} msg={msg}/>}


        {/* ★ CHỜ GỬI — per item, sorted */}
        {tab==="ems"&&<EMSTab active={active} catalog={catalog} emsHistory={emsHistory} safePost={safePost} busy={busy} t={t} msg={msg} bank={bank}/>}

        {tab==="ship"&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
            <h2 style={{fontSize:18,fontWeight:800,color:t.tx}}>🚚 Chờ gửi</h2>
            <div style={{display:"flex",gap:4}}>
              {shipData.length>0&&<button onClick={()=>{const checked=active.filter(o=>o["TRẠNG THÁI"]==="Về kho"&&shipSel.has(o._rowIndex));if(!checked.length){msg("⚠️ Chưa tick đơn nào");return;}const withAddr=checked.filter(o=>{const a=getAddr(addrs,String(o["Tên khách"]||"").trim(),String(o["Link fb"]||"").trim());return a&&(a.postal||a.pref||a.city||a.street);});const skipped=checked.length-withAddr.length;if(!withAddr.length){msg("⚠️ Không có đơn nào đủ địa chỉ");return;}const added=addToBossDraft(withAddr);if(added)msg(`✅ Đã thêm ${added} đơn vào BOSS draft`+(skipped>0?` (bỏ ${skipped} chưa có ĐC)`:""));}} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#EA580C",color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer"}}>📋 +Draft ({[...shipSel].length||0})</button>}
              {bossDraft.length>0&&!draftExported&&<button onClick={()=>{exportBOSS(bossDraft,addrs);setDraftExported(true);msg("📥 CSV đã tải — check file rồi bấm ✅ Xác nhận gửi");}} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#2563EB",color:"#fff",fontSize:10,fontWeight:600,cursor:"pointer"}}>📥 Tải CSV ({bossDraft.length})</button>}
              {draftExported&&<button onClick={async()=>{if(!confirm(`✅ File CSV OK? Chuyển ${bossDraft.length} đơn → "Đã gửi"?`))return;const data=bossDraft.map(o=>({rowIndex:o._rowIndex,tenKhach:String(o["Tên khách"]||"").trim(),maSP:String(o["Mã SP"]||"")}));await safePost({action:"shipItems",items:data,tracking:"BOSS"},`✅ ${bossDraft.length} đơn → Đã gửi`);clearBossDraft();setDraftExported(false);setDraftAddrStatus({});}} disabled={busy} style={{padding:"6px 12px",borderRadius:8,border:"none",background:"#059669",color:"#fff",fontSize:10,fontWeight:600,cursor:busy?"wait":"pointer",opacity:busy?.6:1,animation:"pulse 1.5s infinite"}}>✅ Xác nhận gửi</button>}
              {draftExported&&<button onClick={()=>{setDraftExported(false);msg("↩ Huỷ — đơn vẫn ở draft");}} style={{padding:"6px 12px",borderRadius:8,border:`1px solid ${t.bd}`,background:t.sf,color:"#D97706",fontSize:10,cursor:"pointer"}}>✕ Huỷ</button>}
            </div>
          </div>
          <div style={{marginBottom:10}}>
            <details style={{fontSize:11}}>
              <summary style={{cursor:"pointer",color:t.dm,fontWeight:600,marginBottom:4}}>🏦 Thông tin CK (bấm sửa)</summary>
              <textarea value={bank} onChange={e=>saveBank(e.target.value)} rows={10} style={{width:"100%",padding:"8px 10px",border:`1px solid ${t.bd}`,borderRadius:8,fontSize:11,background:t.inp,color:t.tx,fontFamily:"inherit",resize:"vertical",lineHeight:1.5}}/>
            </details>
          </div>
          {bossDraft.length>0&&<div style={{marginBottom:10,background:dark?"#1C1917":"#FFF7ED",borderRadius:10,border:`1px solid ${dark?"#EA580C33":"#FDBA74"}`,padding:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <span style={{fontSize:12,fontWeight:700,color:"#EA580C"}}>📋 BOSS Draft ({bossDraft.length} đơn)</span>

                <button onClick={()=>{if(confirm("Xoá toàn bộ draft?"))clearBossDraft();}} style={{padding:"3px 8px",borderRadius:6,border:"none",background:"#FEE2E2",color:"#DC2626",fontSize:10,cursor:"pointer"}}>🗑 Xoá</button>

            </div>
            <div style={{maxHeight:250,overflowY:"auto",fontSize:10}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead><tr style={{background:dark?"#292524":"#FED7AA",position:"sticky",top:0}}>
                  <th style={{padding:"3px 4px",textAlign:"left",color:t.dm}}>Khách</th>
                  <th style={{padding:"3px 4px",textAlign:"left",color:t.dm}}>SP</th>
                  <th style={{padding:"3px 4px",textAlign:"left",color:t.dm}}>Size/Màu</th>

                  <th style={{padding:"3px 4px",width:24}}></th>
                </tr></thead>
                <tbody>{bossDraft.map((o,i)=>{
                  const custName=String(o["Tên khách"]||"").trim();
                  const custFb=String(o["Link fb"]||"").trim();

                  const cl=String(o["COLOR"]||"").trim();
                  const addrSt=draftAddrStatus[custName];
                  const a=getAddr(addrs,custName,custFb)||{};
                  const hasFullAddr=a.postal&&a.pref&&a.city;
                  return <tr key={i} style={{borderBottom:`1px solid ${t.bd}22`}}>

          </div>}
          {!shipData.length?<div style={{background:t.sf,borderRadius:12,padding:30,textAlign:"center",border:`1px solid ${t.bd}`}}><div style={{fontSize:32,marginBottom:8}}>📭</div><p style={{color:t.tx,fontWeight:600}}>Không có hàng "Về kho"</p></div>:<>

          {shipData.map((cust,ci)=><ShipCard key={ci} cust={cust} ci={ci} shipData={shipData} shipSel={shipSel} setShipSel={setShipSel} copyNotify={copyNotify} doShip={doShip} cancelOrder={cancelOrder} setMCust={setMCust} busy={busy} t={t} addToBossDraft={addToBossDraft} addrs={addrs} bossDraft={bossDraft} msg={msg}/>)}
