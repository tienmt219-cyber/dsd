        {/* ★ KHO — Smart nhập kho + auto chuyển Về kho */}
        {tab==="stock"&&<StockTab stock={stock} active={active} surplus={surplus} surplusData={surplusData} safePost={safePost} busy={busy} msg={msg} t={t} onReload={()=>load()}/>}

        {tab==="product"&&<ProductTab catalog={catalog} orders={active} stock={stock} surplusData={surplusData} safePost={safePost} busy={busy} t={t} msg={msg}/>}

        {tab==="tools"&&<ToolsTab catalog={catalog} active={active} orders={orders} stock={stock} shipped={shipped} stats={stats} bank={bank} t={t} msg={msg} safePost={safePost} busy={busy}/>}

        {/* ĐÃ GỬI */}
        {tab==="history"&&<CKTab orders={orders} ckView={ckView} setCkView={setCkView} doCK={doCK} doUnCK={doUnCK} doUnship={doUnship} busy={busy} t={t} bank={bank} msg={msg} setMCust={setMCust}/>}
        </>}
      </div>
    </div>

    {mob&&<div style={{position:"fixed",bottom:0,left:0,right:0,display:"flex",background:t.sf,borderTop:`1px solid ${t.bd}`,padding:"3px 0 max(8px, env(safe-area-inset-bottom))",zIndex:50,boxShadow:"0 -2px 12px rgba(0,0,0,.06)"}}>
      {NAV.map(n=><button key={n.id} onClick={()=>{setTab(n.id);setSearch("");setFilt("Tất cả");setSel(new Set());setShipSel(new Set());}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"5px 0 3px",border:"none",background:"transparent",color:tab===n.id?t.ac:t.dm,fontSize:10,fontWeight:tab===n.id?700:600,cursor:"pointer"}}><span style={{fontSize:18,lineHeight:1}}>{n.icon}</span>{n.l}</button>)}
    </div>}
    {!mob&&<button onClick={()=>setMAdd(true)} style={{position:"fixed",bottom:18,right:18,width:46,height:46,borderRadius:14,border:"none",background:"linear-gradient(135deg,#7C3AED,#E8567F)",color:"#fff",fontSize:20,cursor:"pointer",boxShadow:"0 4px 20px rgba(124,58,237,.3)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>}
    <button onClick={()=>window.scrollTo({top:0,behavior:"smooth"})} style={{position:"fixed",bottom:mob?62:18,right:mob?8:70,width:32,height:32,borderRadius:8,border:"none",background:t.sf,color:t.dm,fontSize:14,cursor:"pointer",boxShadow:"0 2px 8px rgba(0,0,0,.1)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",border:`1px solid ${t.bd}`}}>↑</button>
  </div>;
}

// ═══ CK TAB (extracted component) ═══
function CKTab({orders,ckView,setCkView,doCK,doUnCK,doUnship,busy,t,bank,msg,setMCust}){
  const allSent=orders.filter(o=>o["TRẠNG THÁI"]==="Đã gửi");
  const chuaCK=allSent.filter(o=>!(o._note||"").includes("💰CK"));
  const daCK=allSent.filter(o=>(o._note||"").includes("💰CK"));
  const groupBy=(list)=>{const m={};list.forEach(o=>{const n=String(o["Tên khách"]||"").trim();const fb=String(o["Link fb"]||"").trim();const key=n+"|"+normalizeFB(fb||"");if(!m[key])m[key]={items:[],rev:0,fb:fb,name:n};m[key].items.push(o);m[key].rev+=(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0);});return Object.entries(m).sort((a,b)=>b[1].rev-a[1].rev);};
  const chuaCKgrp=groupBy(chuaCK);
  const daCKgrp=groupBy(daCK);
  const totalChuaCK=chuaCK.reduce((s,o)=>s+(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0),0);
  const totalDaCK=daCK.reduce((s,o)=>s+(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0),0);

  return <div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
      <h2 style={{fontSize:18,fontWeight:800,color:t.tx}}>💳 Chuyển khoản</h2>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
      <div onClick={()=>setCkView("chua")} style={{background:ckView==="chua"?"#FEF2F2":"transparent",borderRadius:10,padding:12,border:ckView==="chua"?"2px solid #DC2626":`1px solid ${t.bd}`,cursor:"pointer",textAlign:"center"}}>
        <div style={{fontSize:9,color:"#DC2626",fontWeight:700}}>🔴 CHƯA CK</div>
        <div style={{fontSize:20,fontWeight:800,color:"#DC2626"}}>{chuaCKgrp.length}</div>
        <div style={{fontSize:10,color:"#DC2626"}}>khách · ¥{fmt(totalChuaCK)}</div>
      </div>
      <div onClick={()=>setCkView("da")} style={{background:ckView==="da"?"#D1FAE5":"transparent",borderRadius:10,padding:12,border:ckView==="da"?"2px solid #16A34A":`1px solid ${t.bd}`,cursor:"pointer",textAlign:"center"}}>
        <div style={{fontSize:9,color:"#16A34A",fontWeight:700}}>🟢 ĐÃ CK</div>
        <div style={{fontSize:20,fontWeight:800,color:"#16A34A"}}>{daCKgrp.length}</div>
        <div style={{fontSize:10,color:"#16A34A"}}>khách · ¥{fmt(totalDaCK)}</div>
      </div>
    </div>

    {ckView==="chua"&&<>
      {chuaCKgrp.length===0&&<div style={{textAlign:"center",padding:20,color:t.dm}}>🎉 Tất cả đã CK!</div>}
      {chuaCKgrp.map(([name,c],i)=>{
        const isPhone=c.fb.startsWith("📱");
        const sentDays=c.items.reduce((mx,o)=>{const m=(o._note||"").match(/📮SENT (\d{4}-\d{2}-\d{2})/);if(m){const d=Math.floor((Date.now()-new Date(m[1]))/864e5);return d>mx?d:mx;}return mx;},0);
        return <div key={i} style={{background:"#FEF2F2",borderRadius:10,padding:12,marginBottom:8,borderLeft:`4px solid ${sentDays>7?"#DC2626":sentDays>3?"#F59E0B":"#DC2626"}`}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <Avatar name={name} fb={c.fb} size={28}/>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,color:t.tx,cursor:"pointer"}} onClick={()=>setMCust({name:c.name,fb:c.fb||""})}>{c.name}</div>
            <div style={{fontSize:10,color:"#DC2626",fontWeight:600}}>{c.items.length} món · ¥{fmt(c.rev)}{sentDays>0?` · ${sentDays} ngày`:""}</div>
          </div>
          {sentDays>=7&&<span style={{fontSize:9,padding:"2px 6px",borderRadius:4,background:"#DC2626",color:"#fff",fontWeight:700}}>QUÁ HẠN</span>}
        </div>
        {c.fb&&<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,padding:"6px 8px",background:"#fff",borderRadius:6,border:"1px solid #FECACA"}}>
          {isPhone?<>
            <span style={{fontSize:12}}>📱</span>
            <a href={`tel:${c.fb.replace("📱","")}`} style={{flex:1,color:"#7C3AED",fontSize:12,fontWeight:600,textDecoration:"none"}}>{c.fb.replace("📱","")}</a>
          </>:<>
            <span style={{fontSize:12}}>💬</span>
            <a href={c.fb.includes("facebook.com")?c.fb.replace("www.facebook.com","m.facebook.com")+"/messages":c.fb} target="_blank" rel="noopener" style={{flex:1,color:"#7C3AED",fontSize:12,fontWeight:600,textDecoration:"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.fb.replace("https://","").replace("www.facebook.com/","fb/").replace("m.facebook.com/","fb/")}</a>
          </>}
        </div>}
        <div style={{fontSize:10,color:t.dm,marginBottom:6,padding:"4px 0",borderTop:`1px solid #FECACA`}}>
          {c.items.map((o,j)=><div key={j} style={{padding:"2px 0"}}>{o["Mã SP"]} {o["SIZE"]} {o["COLOR"]} x{o["Số lượng"]} · ¥{fmt(o["Giá sp"])}</div>)}
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>doCK(c.items,c.name,c.rev)} disabled={busy} style={{flex:1,padding:"11px 8px",borderRadius:9,border:"none",background:"#16A34A",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",boxShadow:"0 1px 4px rgba(22,163,74,.3)"}}>💰 Đã CK</button>
          <button onClick={()=>{const txt=`Chào ${c.name}! 🌸\nHàng đã gửi rồi ạ!\n\n${c.items.map(o=>`${o["Tên Sp"]||o["Mã SP"]} ${o["SIZE"]} ${o["COLOR"]} x${o["Số lượng"]}`).join("\n")}\n\n💰 Tổng: ¥${fmt(c.rev)}\n\n${bank}\n\nCK xong báo em nhé! 📦`;copyText(txt);msg("📋 Đã copy → mở Messenger");if(c.fb&&!isPhone)setTimeout(()=>window.open(c.fb.includes("facebook.com")?c.fb.replace("www.facebook.com","m.facebook.com")+"/messages":c.fb,"_blank"),500);}} style={{flex:1,padding:"11px 8px",borderRadius:9,border:`1px solid #DC2626`,background:"#FEF2F2",color:"#DC2626",fontSize:13,fontWeight:700,cursor:"pointer"}}>📋 Nhắc → 💬</button>
          <button onClick={async()=>{if(!confirm(`↩ Hoàn tác ${c.items.length} món của ${c.name} → Về kho?`))return;await doUnship(c.items);}} disabled={busy} style={{padding:8,borderRadius:8,border:`1px solid ${t.bd}`,background:t.sf,color:"#D97706",fontSize:11,fontWeight:600,cursor:"pointer",opacity:busy?.5:1}} title="Hoàn tác → Về kho">↩</button>
        </div>
      </div>;})}
    </>}

    {ckView==="da"&&<>
      {daCKgrp.length===0&&<div style={{textAlign:"center",padding:20,color:t.dm}}>Chưa ai CK</div>}
      {daCKgrp.map(([name,c],i)=><div key={i} style={{background:"#D1FAE5",borderRadius:10,padding:10,marginBottom:6,borderLeft:"4px solid #16A34A"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
          <Avatar name={name} fb={c.fb} size={24}/>
          <div style={{flex:1}}>
            <span style={{fontWeight:600,color:t.tx}}>{c.name}</span>
            <span style={{fontSize:10,color:"#16A34A",marginLeft:6}}>{c.items.length} món · ¥{fmt(c.rev)} ✅</span>
          </div>
        </div>
        <div style={{fontSize:10,color:t.dm,marginBottom:4,paddingLeft:32}}>
          {c.items.map((o,j)=><div key={j}>{o["Mã SP"]} {o["SIZE"]} {o["COLOR"]} x{o["Số lượng"]}</div>)}
        </div>
        <div style={{display:"flex",gap:4,paddingLeft:32}}>
          <button onClick={()=>{if(!confirm(`Bỏ CK của ${c.name}? → Quay lại Chưa CK`))return;doUnCK(c.items,c.name);}} disabled={busy} style={{padding:"7px 12px",borderRadius:7,border:`1px solid #F59E0B`,background:"#FEF3C7",color:"#92400E",fontSize:11,fontWeight:600,cursor:"pointer"}}>↩ Bỏ CK</button>
          <button onClick={async()=>{if(!confirm(`↩ Hoàn tác ${c.name}: bỏ CK + quay về Về kho?`))return;await doUnCK(c.items,c.name);await doUnship(c.items);}} disabled={busy} style={{padding:"7px 12px",borderRadius:7,border:`1px solid ${t.bd}`,background:t.sf,color:"#D97706",fontSize:11,fontWeight:600,cursor:"pointer"}}>↩ Về kho</button>
        </div>
      </div>)}
    </>}
  </div>;
}

// ═══ TOOLS TAB ═══
function ToolsTab({catalog,active,orders,stock,shipped,stats,bank,t,msg,safePost,busy}){
  const [tool,setTool]=useState("watermark");
  const [wmImg,setWmImg]=useState(null);
  const [wmCode,setWmCode]=useState("");
  const [wmPrice,setWmPrice]=useState("");
  const [wmPos,setWmPos]=useState("bottom-right");
  const canvasRef=useRef(null);
  const [wmResult,setWmResult]=useState(null);
  const [wmBase64,setWmBase64]=useState(null);
  const [wmSaving,setWmSaving]=useState(false);
  const [tplName,setTplName]=useState("");
  const [cny,setCny]=useState("");
  const [shipGZ,setShipGZ]=useState("30");
  const [rate,setRate]=useState("21.5");
  const [bossJPY,setBossJPY]=useState("200");
  const [margin,setMargin]=useState("35");
  const norm=v=>String(v||"").replace(/\.0$/,"").trim().toUpperCase();

  // ★ WATERMARK
  const doWatermark=()=>{
    if(!wmImg)return;
    const canvas=canvasRef.current;if(!canvas){msg("❌ Canvas không sẵn sàng");return;}
    const ctx=canvas.getContext("2d");
    const img=new Image();
    img.onload=()=>{
      canvas.width=img.width;canvas.height=img.height;
      ctx.drawImage(img,0,0);
      const text=`${wmCode} ¥${wmPrice}`;
      const fontSize=Math.max(20,Math.floor(img.width/18));
      ctx.font=`bold ${fontSize}px Arial`;
      ctx.strokeStyle="rgba(0,0,0,0.6)";ctx.lineWidth=3;
      ctx.fillStyle="#fff";
      const tw=ctx.measureText(text).width;
      const pad=12;
      let x=pad,y=fontSize+pad;
      if(wmPos.includes("right"))x=img.width-tw-pad;
      if(wmPos.includes("bottom"))y=img.height-pad;
      if(wmPos==="center"){x=(img.width-tw)/2;y=img.height/2;}
      // Background bar
      ctx.fillStyle="rgba(0,0,0,0.5)";
      ctx.fillRect(x-6,y-fontSize-2,tw+12,fontSize+8);
      ctx.fillStyle="#fff";
      ctx.strokeText(text,x,y);
      ctx.fillText(text,x,y);
      // ★ Hiện preview + download bằng Blob (fix mobile)
      canvas.toBlob(function(blob){
        if(!blob){msg("❌ Không tạo được ảnh");return;}
        const url=URL.createObjectURL(blob);
        setWmResult(url);
        setWmBase64(canvas.toDataURL("image/jpeg",0.85).split(",")[1]);
        msg(`✅ Watermark ${wmCode} xong! Nhấn giữ ảnh để lưu hoặc bấm tải`);
      },"image/jpeg",0.92);
    };
    img.onerror=()=>msg("❌ Không đọc được ảnh");
    img.src=wmImg;
  };
  const downloadWm=()=>{
    if(!wmResult)return;
    const link=document.createElement("a");
    link.download=`${wmCode||"SP"}-watermark.jpg`;
    link.href=wmResult;
    document.body.appendChild(link);link.click();document.body.removeChild(link);
  };

  // ★ TIN NHẮN MẪU
  const templates=[
    {name:"Chào khách mới",text:`Chào ${tplName||"chị"}! 🌸\n\nBên em có hàng từ GZ về Nhật, ship toàn quốc.\nChị xem hàng trên tường em nhé!\n\nĐặt hàng: inbox mã SP + size + màu\n💜 PayPay: mam264`},
    {name:"Hàng đang ship",text:`Chào ${tplName||"chị"}! 🌸\n\nHàng của ${tplName||"chị"} đang ship từ GZ rồi ạ!\nDự kiến 7-10 ngày nữa về kho.\nVề là em báo ngay! 📦`},
    {name:"Xác nhận đơn",text:`Chào ${tplName||"chị"}! 🌸\n\nEm xác nhận đơn:\n[SP + Size + Màu]\n\nHàng sẽ về trong 7-14 ngày.\nVề kho em báo chị CK nhé! 💜`},
    {name:"Nhắc CK",text:`Chào ${tplName||"chị"}! 🌸\n\nHàng của ${tplName||"chị"} đã về rồi ạ!\n${tplName||"Chị"} CK giúp em để em gửi hàng nhé.\n\n${bank}\n\nCK xong báo em! 📦`},
  ];

  // ★ BÁO CÁO
  const inp={padding:"8px 10px",border:`1.5px solid ${t.bd}`,borderRadius:8,fontSize:12,background:t.inp,color:t.tx,width:"100%",fontFamily:"inherit"};

  return <div>
    <h2 style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:10}}>🛠 Tools</h2>
    <div style={{display:"flex",gap:4,marginBottom:12,overflowX:"auto"}}>
      {[["watermark","🖼 Watermark"],["templates","💬 Tin nhắn"],["calc","💱 Tính giá"],["report","📊 Báo cáo"]].map(([k,l])=>
        <button key={k} onClick={()=>setTool(k)} style={{padding:"6px 12px",borderRadius:8,border:"none",fontSize:11,fontWeight:600,cursor:"pointer",background:tool===k?t.ac:t.sf,color:tool===k?"#fff":t.dm,whiteSpace:"nowrap"}}>{l}</button>)}
    </div>

    {/* ★ WATERMARK */}
    {tool==="watermark"&&<div style={{background:t.sf,borderRadius:12,border:`1px solid ${t.bd}`,padding:14}}>
      <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:8}}>🖼 Watermark ảnh SP</div>
      <p style={{fontSize:11,color:t.dm,marginBottom:10}}>Upload ảnh → dán mã SP + giá → tải về đăng FB</p>
      <input type="file" accept="image/*" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{setWmImg(ev.target.result);setWmResult(null);};r.readAsDataURL(f);}}} style={{marginBottom:8,fontSize:11}}/>
      {wmImg&&<img src={wmImg} style={{width:"100%",maxHeight:200,objectFit:"contain",borderRadius:8,marginBottom:8,background:"#000"}}/>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:8}}>
        <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Mã SP</label>
          <input value={wmCode} onChange={e=>{setWmCode(e.target.value);const p=catalog.find(c=>norm(c["Mã SP"])===norm(e.target.value));if(p)setWmPrice(String(p["Giá bán"]||""));}} style={inp}/></div>
        <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Giá ¥</label><input value={wmPrice} onChange={e=>setWmPrice(e.target.value)} style={inp}/></div>
      </div>
      <div style={{display:"flex",gap:4,marginBottom:8}}>
        {["top-left","top-right","bottom-left","bottom-right","center"].map(p=>
          <button key={p} onClick={()=>setWmPos(p)} style={{flex:1,padding:4,borderRadius:4,border:"none",fontSize:9,background:wmPos===p?t.ac:t.sf,color:wmPos===p?"#fff":t.dm,cursor:"pointer"}}>{p.replace("-"," ")}</button>)}
      </div>
      <button onClick={doWatermark} disabled={!wmImg||!wmCode} style={{width:"100%",padding:10,borderRadius:8,border:"none",background:(!wmImg||!wmCode)?t.bd:"linear-gradient(135deg,#7C3AED,#E8567F)",color:(!wmImg||!wmCode)?t.dm:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>🖼 Tạo Watermark</button>
      {wmResult&&<div style={{marginTop:10}}>
        <img src={wmResult} style={{width:"100%",borderRadius:8,border:`2px solid #16A34A`}}/>
        <p style={{fontSize:10,color:t.dm,marginTop:4,textAlign:"center"}}>📱 Nhấn giữ ảnh → Lưu ảnh (mobile) hoặc bấm nút dưới</p>
        <div style={{display:"flex",gap:6,marginTop:6}}>
          <button onClick={downloadWm} style={{flex:1,padding:10,borderRadius:8,border:"none",background:"#16A34A",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer"}}>📥 Tải ảnh</button>
          <button onClick={async()=>{
            if(!wmBase64||!wmCode){msg("⚠️ Cần mã SP");return;}
            setWmSaving(true);
            try{
              const r=await POST({action:"uploadImage",base64:wmBase64,fileName:wmCode+"-watermark.jpg",maSP:wmCode});
              if(r.success)msg(`✅ Đã lưu ảnh ${wmCode} vào Catalog + Drive`);
              else msg("❌ "+(r.error||"Lỗi upload"));
            }catch(e){msg("❌ "+e.message);}
            setWmSaving(false);
          }} disabled={wmSaving||busy} style={{flex:1,padding:10,borderRadius:8,border:"none",background:wmSaving?"#94A3B8":"#7C3AED",color:"#fff",fontSize:12,fontWeight:700,cursor:wmSaving?"wait":"pointer"}}>{wmSaving?"⏳...":"📷 Lưu Catalog"}</button>
        </div>
      </div>}
      <canvas ref={canvasRef} style={{display:"none"}}/>
    </div>}

    {/* ★ TÍNH GIÁ — 5 chi phí */}
    {tool==="calc"&&<div style={{background:t.sf,borderRadius:12,border:`1px solid ${t.bd}`,padding:14}}>
      <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:4}}>💱 Tính giá bán</div>
      <p style={{fontSize:11,color:t.dm,marginBottom:10}}>Nhập chi phí + margin → ra giá bán</p>
      {(()=>{
        const r=Number(rate||0);
        const nhapJPY=Number(cny||0)*r;
        const shipJPY=Number(shipGZ||0)*r;
        const boss=Number(bossJPY||0);
        const totalCost=nhapJPY+shipJPY+boss;
        const mg=Number(margin||0)/100;
        const sellExact=mg<1?totalCost/(1-mg):0;
        const round=v=>Math.ceil(v/50)*50;
        const sellRound=round(sellExact);
        const profit=sellRound-totalCost;
        const realMargin=sellRound>0?((profit/sellRound)*100).toFixed(1):0;
        return <>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Giá nhập (CNY)</label><input value={cny} onChange={e=>setCny(e.target.value)} type="number" placeholder="45" style={inp}/></div>
            <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Ship GZ→JP (CNY/SP)</label><input value={shipGZ} onChange={e=>setShipGZ(e.target.value)} type="number" style={inp}/></div>
            <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Tỉ giá CNY→JPY</label><input value={rate} onChange={e=>setRate(e.target.value)} type="number" style={inp}/></div>
            <div><label style={{fontSize:10,color:t.dm,fontWeight:600}}>Phí kho BOSS (JPY)</label><input value={bossJPY} onChange={e=>setBossJPY(e.target.value)} type="number" style={inp}/></div>
          </div>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:10,color:t.dm,fontWeight:600}}>Margin mong muốn (%)</label>
            <div style={{display:"flex",gap:4,marginTop:4}}>
              {["25","30","35","40","45","50"].map(v=>
                <button key={v} onClick={()=>setMargin(v)} style={{flex:1,padding:"6px 0",borderRadius:6,border:"none",fontSize:11,fontWeight:600,cursor:"pointer",background:margin===v?t.ac:t.sf,color:margin===v?"#fff":t.dm}}>{v}%</button>)}
            </div>
            <input value={margin} onChange={e=>setMargin(e.target.value)} type="number" placeholder="35" style={{...inp,marginTop:4,textAlign:"center",fontSize:16,fontWeight:700}}/>
          </div>
          {Number(cny)>0&&<>
          <div style={{background:t.bg,borderRadius:10,padding:12,border:`1px solid ${t.bd}`,marginBottom:12}}>
            <div style={{fontSize:11}}>
              {[{l:"Giá nhập",v:nhapJPY,note:`${cny} × ${rate}`},{l:"Ship GZ→JP",v:shipJPY,note:`${shipGZ} × ${rate}`},{l:"Phí kho BOSS",v:boss}].map((x,i)=>
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:`1px solid ${t.bd}`}}>
                  <span style={{color:t.dm}}>{x.l} <span style={{fontSize:9}}>({x.note})</span></span>
                  <span style={{fontWeight:600,color:t.tx}}>¥{fmt(Math.round(x.v))}</span>
                </div>)}
              <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontWeight:700}}>
                <span style={{color:"#DC2626"}}>TỔNG CHI PHÍ</span>
                <span style={{color:"#DC2626"}}>¥{fmt(Math.round(totalCost))}</span>
              </div>
            </div>
          </div>
          <div style={{background:"#D1FAE5",borderRadius:12,padding:16,textAlign:"center"}}>
            <div style={{fontSize:11,color:"#065F46",fontWeight:600,marginBottom:4}}>GIÁ BÁN (margin {margin}%)</div>
            <div style={{fontSize:28,fontWeight:800,color:"#16A34A"}}>¥{fmt(sellRound)}</div>
            <div style={{fontSize:12,color:"#065F46",marginTop:6}}>Lãi: ¥{fmt(Math.round(profit))}/SP · Margin thực: {realMargin}%</div>
          </div>
          </>}
        </>;
      })()}
    </div>}

    {/* ★ TIN NHẮN MẪU */}
    {tool==="templates"&&<div style={{background:t.sf,borderRadius:12,border:`1px solid ${t.bd}`,padding:14}}>
      <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:8}}>💬 Tin nhắn mẫu</div>
      <input value={tplName} onChange={e=>setTplName(e.target.value)} placeholder="Tên khách (tuỳ chọn)" style={{...inp,marginBottom:10}}/>
      {templates.map((tpl,i)=><div key={i} style={{background:t.bg,borderRadius:8,padding:10,marginBottom:8,border:`1px solid ${t.bd}`}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:12,fontWeight:600,color:t.tx}}>{tpl.name}</span>
          <button onClick={()=>{copyText(tpl.text);msg(`📋 Đã copy: ${tpl.name}`);}} style={{padding:"3px 8px",borderRadius:4,border:"none",background:t.ac,color:"#fff",fontSize:10,cursor:"pointer"}}>📋 Copy</button>
        </div>
        <pre style={{fontSize:10,color:t.dm,whiteSpace:"pre-wrap",margin:0,lineHeight:1.4}}>{tpl.text}</pre>
      </div>)}
    </div>}

    {/* ★ BÁO CÁO */}
    {tool==="report"&&(()=>{
      const todayStr=new Date().toISOString().slice(0,10);
      const todayLabel=new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"numeric",year:"numeric"});
      // Tất cả đơn (không lọc active)
      const allOrders=orders.filter(o=>!["Đã xoá","Lưu trữ"].includes(o["TRẠNG THÁI"]));
      // Đơn tạo hôm nay
      const newToday=allOrders.filter(o=>String(o["NGÀY OD"]||"").slice(0,10)===todayStr);
      const newCust=[...new Set(newToday.map(o=>o["Tên khách"]))];
      const newRev=newToday.reduce((s,o)=>s+(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0),0);
      // Đếm theo trạng thái — từ tất cả orders
      const byS={};["CHƯA ĐẶT","Chờ hàng","Đang ship","Về kho","Đã gửi"].forEach(s=>byS[s]=0);
      allOrders.forEach(o=>byS[o["TRẠNG THÁI"]]=(byS[o["TRẠNG THÁI"]]||0)+1);
      // Nhập kho hôm nay
      const stockToday=stock.filter(s=>String(s["Ngày nhập"]||s["ngày nhập"]||"").slice(0,10)===todayStr);
      const stockQty=stockToday.reduce((s,x)=>s+Number(x["Số lượng nhập"]||x["Số lượng"]||0),0);
      // Chờ gửi
      const veKho=allOrders.filter(o=>o["TRẠNG THÁI"]==="Về kho").length;

      const surplusTxt=surplusData.length>0?`\n📦 HÀNG DƯ (${surplusData.reduce((s,x)=>s+x.sl,0)} SP):\n${surplusData.slice(0,5).map(s=>`  ${s.ma} ${s.sz} ${s.cl}: ${s.sl} [${s.tt}]`).join("\n")}\n`:"";
      const reportText=`📊 BÁO CÁO ${todayLabel}\n${"━".repeat(25)}\n\n📝 ĐƠN MỚI HÔM NAY:\n  ${newToday.length} món · ${newCust.length} khách\n  DT: ¥${fmt(newRev)}\n  ${newCust.slice(0,5).join(", ")}${newCust.length>5?"...":""}\n\n📦 NHẬP KHO HÔM NAY:\n  ${stockToday.length>0?`${stockToday.length} lần · ${stockQty} món`:"Chưa nhập"}\n${stockToday.slice(0,5).map(s=>`  ${s["Mã SP"]} ${s["Size"]||""} ${s["Color"]||""} x${s["Số lượng nhập"]||s["Số lượng"]||""}`).join("\n")}\n\n📋 TỔNG QUAN (${allOrders.length} đơn):\n  CHƯA ĐẶT: ${byS["CHƯA ĐẶT"]}\n  Chờ hàng: ${byS["Chờ hàng"]}\n  Đang ship: ${byS["Đang ship"]}\n  Về kho: ${byS["Về kho"]} ← chờ gửi\n  Đã gửi: ${byS["Đã gửi"]}\n\n💰 DOANH THU:\n  Tổng: ¥${fmt(stats.rev)}\n  Lợi nhuận: ¥${fmt(stats.profit)}\n\n${stats.overdue>0?`⚠️ ${stats.overdue} đơn quá 21 ngày!\n`:""}${surplusTxt}${"━".repeat(25)}\n🌸 Dream Team`;

      return <div style={{background:t.sf,borderRadius:12,border:`1px solid ${t.bd}`,padding:14}}>
        <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:10}}>📊 Báo cáo — {todayLabel}</div>
        
        <div style={{background:t.bg,borderRadius:10,padding:12,marginBottom:8,border:`1px solid ${t.bd}`}}>
          <div style={{fontSize:11,fontWeight:700,color:t.ac,marginBottom:6}}>📝 Đơn mới hôm nay</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
            <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:t.ac}}>{newToday.length}</div><div style={{fontSize:9,color:t.dm}}>món</div></div>
            <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:t.pk}}>{newCust.length}</div><div style={{fontSize:9,color:t.dm}}>khách</div></div>
            <div style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:"#D97706"}}>¥{fmt(newRev)}</div><div style={{fontSize:9,color:t.dm}}>doanh thu</div></div>
          </div>
          {newCust.length>0&&<div style={{marginTop:6,fontSize:10,color:t.dm}}>👤 {newCust.slice(0,8).join(", ")}{newCust.length>8?` +${newCust.length-8}`:""}</div>}
        </div>

        <div style={{background:t.bg,borderRadius:10,padding:12,marginBottom:8,border:`1px solid ${t.bd}`}}>
          <div style={{fontSize:11,fontWeight:700,color:t.ac,marginBottom:6}}>📦 Nhập kho hôm nay</div>
          {stockToday.length>0?<>
            <div style={{fontSize:13,fontWeight:700,color:"#16A34A"}}>{stockToday.length} lần · {stockQty} món</div>
            <div style={{marginTop:4,fontSize:10,color:t.dm}}>
              {stockToday.slice(0,5).map((s,i)=><div key={i}>{s["Mã SP"]} {s["Size"]||""} {s["Color"]||""} x{s["Số lượng nhập"]||s["Số lượng"]||""}</div>)}
            </div>
          </>:<div style={{fontSize:11,color:t.dm}}>Chưa nhập hôm nay</div>}
        </div>

        <div style={{background:t.bg,borderRadius:10,padding:12,marginBottom:8,border:`1px solid ${t.bd}`}}>
          <div style={{fontSize:11,fontWeight:700,color:t.ac,marginBottom:6}}>📋 Tổng quan ({allOrders.length} đơn)</div>
          {["CHƯA ĐẶT","Chờ hàng","Đang ship","Về kho","Đã gửi"].map(s=>
            <div key={s} style={{display:"flex",justifyContent:"space-between",padding:"3px 0",fontSize:11}}>
              <span style={{display:"flex",alignItems:"center",gap:4}}><span style={{width:6,height:6,borderRadius:"50%",background:SC[s]}}/>{s}</span>
              <b style={{color:t.tx}}>{byS[s]||0}</b>
            </div>)}
          <div style={{marginTop:8,borderTop:`1px solid ${t.bd}`,paddingTop:6,display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,fontSize:11}}>
            <div style={{color:t.dm}}>DT: <b style={{color:"#D97706"}}>¥{fmt(stats.rev)}</b></div>
            <div style={{color:t.dm}}>Lãi: <b style={{color:"#16A34A"}}>¥{fmt(stats.profit)}</b></div>
          </div>
          {stats.overdue>0&&<div style={{fontSize:11,color:"#DC2626",marginTop:6,fontWeight:600}}>⚠️ {stats.overdue} đơn quá 21 ngày!</div>}
        </div>

        <button onClick={()=>{copyText(reportText);msg("📋 Đã copy báo cáo!");}} style={{width:"100%",padding:12,borderRadius:8,border:"none",background:t.ac,color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer"}}>📋 Copy báo cáo</button>
      </div>;
    })()}
  </div>;
}

function ShipCard({cust,ci,shipData,shipSel,setShipSel,copyNotify,doShip,cancelOrder,setMCust,busy,t,addToBossDraft,addrs,bossDraft,msg}){
  const isPartial=cust.pending>0;
  const isFirstPartial=isPartial&&(ci===0||!shipData[ci-1].pending);
  const selItems=cust.items.filter(o=>shipSel.has(o._rowIndex));
  const allSel=cust.items.every(o=>shipSel.has(o._rowIndex));
  const money=selItems.reduce((s,o)=>s+(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0),0);
  const [shipFee,setShipFee]=useState("");
  const [tracking,setTracking]=useState("");
  const total=money+(Number(shipFee)||0);
  const inDraft=bossDraft?cust.items.every(o=>bossDraft.some(d=>d._rowIndex===o._rowIndex)):false;
  const addCustToDraft=()=>{
    const items=cust.items.filter(o=>{const a=getAddr(addrs,String(o["Tên khách"]||"").trim(),String(o["Link fb"]||"").trim());return a&&(a.postal||a.pref||a.city||a.street);});
    const skipped=cust.items.length-items.length;
    if(!items.length){msg("⚠️ "+cust.name+": thiếu địa chỉ");return;}
    const added=addToBossDraft(items);
    if(added)msg(`✅ ${cust.name}: ${added} đơn → draft`+(skipped>0?` (${skipped} thiếu ĐC)`:""));
  };
  return <>
    {isFirstPartial&&<h3 style={{fontSize:13,fontWeight:700,color:"#D97706",marginTop:16,marginBottom:8}}>⚠️ Về 1 phần ({shipData.filter(c=>c.pending>0).length})</h3>}
    <div style={{background:t.sf,borderRadius:12,border:`1px solid ${isPartial?"#FDE68A":t.bd}`,padding:14,marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
          <Avatar name={cust.name} fb={cust.fb} size={28}/>
          <div>
          <span style={{fontSize:14,fontWeight:700,color:t.tx,cursor:"pointer"}} onClick={()=>setMCust({name:cust.name,fb:cust.fb||""})}>{cust.name}</span>
          {!isPartial&&<span style={{fontSize:9,background:"#D1FAE5",color:"#065F46",padding:"1px 6px",borderRadius:4,marginLeft:6,fontWeight:600}}>ĐỦ</span>}
          <span style={{fontSize:10,color:"#0D9488",marginLeft:6}}>{cust.items.length} món</span>
          {cust.pending>0&&<span style={{fontSize:10,color:"#D97706",marginLeft:4}}>+{cust.pending} chưa về</span>}
        </div></div></div>
        <label style={{fontSize:10,color:t.dm,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
          <input type="checkbox" checked={allSel} onChange={()=>{const ns=new Set(shipSel);cust.items.forEach(o=>{allSel?ns.delete(o._rowIndex):ns.add(o._rowIndex);});setShipSel(ns);}}/>Tất cả
        </label>
      </div>
      {cust.items.map((o,j)=>{const isSel=shipSel.has(o._rowIndex);const days=daysAgo(String(o["NGÀY OD"]||"").slice(0,10));const fromSurplus=(o._note||"").includes("📦DƯ");
        return <div key={j} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 0",borderBottom:`1px solid ${t.bd}`}}>
          <input type="checkbox" checked={isSel} onChange={()=>{const ns=new Set(shipSel);ns.has(o._rowIndex)?ns.delete(o._rowIndex):ns.add(o._rowIndex);setShipSel(ns);}}/>
          <span style={{fontSize:12,fontWeight:600,color:t.ac,width:45}}>{o["Mã SP"]}</span>
          {fromSurplus&&<span style={{fontSize:7,padding:"1px 4px",borderRadius:3,background:"#D1FAE5",color:"#065F46",fontWeight:700}}>DƯ</span>}
          <span style={{fontSize:11,color:t.tx,flex:1}}>{o["Tên Sp"]} <span style={{color:t.dm}}>{o["SIZE"]} {o["COLOR"]}</span></span>
          <span style={{fontSize:11,color:t.dm}}>x{o["Số lượng"]}</span>
          <span style={{fontSize:9,fontWeight:700,color:days>21?"#DC2626":days>7?"#D97706":"#16A34A"}}>{days}d</span>
          <span style={{fontSize:11,fontWeight:600,color:"#0D9488"}}>¥{fmt((Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0))}</span>
          <button onClick={()=>cancelOrder(o)} disabled={busy} title="Bùng hàng" style={{border:"none",background:"#FEE2E2",borderRadius:4,cursor:"pointer",fontSize:11,padding:"2px 5px",opacity:busy?.3:1,color:"#DC2626",fontWeight:600}}>🚫</button>
        </div>;})}
      {selItems.length>0&&<div style={{background:"#F0FDF4",borderRadius:8,padding:10,marginTop:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:6}}>
          <span style={{fontSize:12,fontWeight:700,color:"#065F46"}}>{selItems.length} món = ¥{fmt(money)}</span>
          <span style={{fontSize:11,color:t.dm}}>+ Ship:</span>
          <input value={shipFee} onChange={e=>setShipFee(e.target.value)} placeholder="ship" type="number" style={{width:60,padding:"3px 6px",borderRadius:6,border:`1px solid ${t.bd}`,fontSize:11,background:t.inp,color:t.tx}}/>
          <span style={{fontSize:14,fontWeight:800,color:"#065F46"}}>= ¥{fmt(total)}</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:10,color:t.dm}}>🚚 Tracking:</span>
          <input value={tracking} onChange={e=>setTracking(e.target.value)} placeholder="mã vận đơn (tuỳ chọn)" style={{flex:1,padding:"3px 6px",borderRadius:6,border:`1px solid ${t.bd}`,fontSize:11,background:t.inp,color:t.tx}}/>
        </div>
      </div>}
      <div style={{display:"flex",gap:6,marginTop:8}}>
        <button onClick={addCustToDraft} disabled={inDraft} style={{padding:"10px 12px",borderRadius:9,border:"none",background:inDraft?"#D1FAE5":"#EA580C",color:inDraft?"#065F46":"#fff",fontSize:12,fontWeight:600,cursor:inDraft?"default":"pointer"}}>{inDraft?"✅ Đã draft":"📋 +Draft"}</button>
        <button onClick={()=>copyNotify(cust,selItems.length>0?selItems:null,Number(shipFee)||0,tracking)} style={{flex:1,padding:"10px 8px",borderRadius:9,border:"none",background:"linear-gradient(135deg,#7C3AED,#E8567F)",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer"}}>📋 Copy {selItems.length>0?`(${selItems.length})`:""}</button>
        <button onClick={()=>{const items=selItems.length>0?selItems:cust.items;if(!confirm(`Gửi ${items.length} món cho ${cust.name}?`))return;doShip(items,tracking);}} disabled={busy} style={{padding:"10px 16px",borderRadius:9,border:"none",background:"#16A34A",color:"#fff",fontSize:12,fontWeight:600,cursor:"pointer",opacity:busy?.5:1,boxShadow:"0 1px 4px rgba(22,163,74,.3)"}}>📦 Gửi {selItems.length>0?`(${selItems.length})`:""}</button>
      </div>
    </div>
  </>;
}

function StockTab({stock,active,surplus,surplusData,safePost,busy:parentBusy,msg,t,onReload}){
  const [ma,setMa]=useState("");const [sz,setSz]=useState("S");const [cl,setCl]=useState("");const [qt,setQt]=useState("1");
  const [result,setResult]=useState(null);const [loading,setLoading]=useState(false);
  const inp={padding:"10px 14px",border:`1.5px solid ${t.bd}`,borderRadius:10,fontSize:13,background:t.inp,color:t.tx,width:"100%",fontFamily:"inherit"};
  const busy=parentBusy||loading;
  
  const preview=useMemo(()=>{
    if(!ma)return[];
    const norm=v=>String(v||"").replace(/\.0$/,"").trim().toUpperCase();
    return active.filter(o=>
      norm(o["Mã SP"])===norm(ma)&&
      (!sz||norm(o["SIZE"])===norm(sz))&&
      (!cl||norm(o["COLOR"])===norm(cl))&&
      ["CHƯA ĐẶT","Chờ hàng","Đang ship"].includes(o["TRẠNG THÁI"])
    ).sort((a,b)=>String(a["NGÀY OD"]||"").localeCompare(String(b["NGÀY OD"]||"")));
  },[ma,sz,cl,active]);

  const doAdd=async()=>{
    if(!ma||!cl)return;
    setLoading(true);setResult(null);
    try{
      const r=await POST({action:"addStock",item:{maSP:ma,size:sz,color:cl,soLuong:Number(qt)||1}});
      if(r.success){
        setResult(r);
        msg(`📦 Nhập ${qt} → ${r.matched||0} đơn auto Về kho!`);
        setMa("");setCl("");setQt("1");
        setLoading(false);
        onReload();return;
      }else{msg("❌ "+(r.error||""));}
    }catch(e){msg("❌ "+e.message);}
    setLoading(false);
  };

  return <div>
    <h2 style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:4}}>📦 Nhập kho</h2>
    <p style={{color:t.dm,fontSize:11,marginBottom:12}}>Nhập hàng về → auto chuyển đơn khớp → "Về kho"</p>
    
    <div style={{background:t.sf,borderRadius:12,border:`1px solid ${t.bd}`,padding:14,marginBottom:12}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 80px",gap:8,marginBottom:8}}>
        <div><label style={{fontSize:10,color:t.dm,fontWeight:600,marginBottom:3,display:"block"}}>Mã SP *</label><input value={ma} onChange={e=>setMa(e.target.value)} style={inp}/></div>
        <div><label style={{fontSize:10,color:t.dm,fontWeight:600,marginBottom:3,display:"block"}}>Size</label><select value={sz} onChange={e=>setSz(e.target.value)} style={inp}>{SIZES.map(s=><option key={s}>{s}</option>)}</select></div>
        <div><label style={{fontSize:10,color:t.dm,fontWeight:600,marginBottom:3,display:"block"}}>Màu *</label><input value={cl} onChange={e=>setCl(e.target.value)} style={inp}/></div>
        <div><label style={{fontSize:10,color:t.dm,fontWeight:600,marginBottom:3,display:"block"}}>SL</label><input value={qt} onChange={e=>setQt(e.target.value)} type="number" style={inp}/></div>
      </div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:10}}>
        {COLORS.map(c=><button key={c} onClick={()=>setCl(c)} style={{padding:"3px 8px",borderRadius:6,border:`1.5px solid ${cl===c?"#0D9488":t.bd}`,background:cl===c?"#EEFBF7":t.sf,color:cl===c?"#0D9488":t.dm,fontSize:10,fontWeight:600,cursor:"pointer"}}>{c}</button>)}
      </div>
      
      {ma&&preview.length>0&&<div style={{background:"#F0FDF4",borderRadius:8,padding:10,marginBottom:10}}>
        <div style={{fontSize:11,fontWeight:600,color:"#065F46",marginBottom:4}}>📋 {preview.length} đơn khớp → nhập {qt} sẽ auto {Math.min(preview.length,Number(qt)||1)} đơn Về kho:</div>
        {preview.slice(0,Number(qt)||1).map((o,i)=><div key={i} style={{fontSize:11,color:"#0D9488"}}>  {i+1}. {o["Tên khách"]} — {o["TRẠNG THÁI"]} ({String(o["NGÀY OD"]||"").slice(0,10)})</div>)}
        {preview.length>Number(qt||1)&&<div style={{fontSize:10,color:t.dm,marginTop:2}}>...+{preview.length-Number(qt||1)} đơn chờ đợt sau</div>}
      </div>}
      {ma&&preview.length===0&&cl&&<div style={{background:"#FEF3C7",borderRadius:8,padding:10,marginBottom:10}}><span style={{fontSize:11,color:"#92400E"}}>⚠️ Không có đơn khớp {ma} {sz} {cl}</span></div>}
      
      <button onClick={doAdd} disabled={!ma||!cl||busy} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:(!ma||!cl)?t.bd:"#0D9488",color:(!ma||!cl)?t.dm:"#fff",fontSize:14,fontWeight:700,cursor:(!ma||!cl||busy)?"not-allowed":"pointer",opacity:busy?.6:1}}>{loading?"⏳...":"📦 Nhập kho"} {ma?`${ma} ${sz} ${cl} x${qt}`:""}</button>
    </div>
    
    {result&&result.matched>0&&<div style={{background:"#D1FAE5",border:"1px solid #86EFAC",borderRadius:10,padding:14,marginBottom:12}}>

function GZTab({gzData,gzCounts,surplusData,safePost,busy,t,mob,msg}){
  const [sel,setSel]=useState({stage:"",keys:new Set()});
  const stats=gzCounts||{cd:0,ch:0,ds:0};

  const bulkUpdate=async(stage,newStatus,label)=>{
    const rowsKey=stage==="cd"?"rowsCD":stage==="ch"?"rowsCH":"rowsDS";
    const qtyKey=stage==="cd"?"chuaDat":stage==="ch"?"choHang":"dangShip";
    const items=[];
    const surplusList=[];
    gzData.forEach((g,i)=>{
      if(!sel.keys.has(i)||!g[rowsKey])return;
      g[rowsKey].forEach(o=>{items.push({rowIndex:o._rowIndex,tenKhach:String(o["Tên khách"]||"").trim(),maSP:String(o["Mã SP"]||""),newStatus});});
      // ★ Check hàng dư: cột "Đặt" > số đơn thật
      if(stage==="cd"){
        const actualQty=Number(customQty[i]!==undefined?customQty[i]:g[qtyKey]);
        const orderQty=g[qtyKey];
        if(actualQty>orderQty){
          surplusList.push({ma:g.ma,sz:g.size,cl:g.color,qty:actualQty-orderQty});
        }
      }
    });
    if(!items.length)return;
    const surplusMsg=surplusList.length>0?`\n\nHàng dư:\n${surplusList.map(s=>`${s.ma} ${s.sz} ${s.cl}: +${s.qty}`).join("\n")}`:"";
    if(!confirm(items.length+" đơn → '"+newStatus+"'?"+surplusMsg))return;
    await safePost({action:"bulkUpdateStatus",items},label+" "+items.length+" đơn!");
    // Tạo hàng dư
    for(const s of surplusList){
      await POST({action:"addSurplus",maSP:s.ma,size:s.sz,color:s.cl,qty:s.qty,status:"Chờ hàng"});
    }
    if(surplusList.length>0)msg(`📦 +${surplusList.reduce((a,s)=>a+s.qty,0)} hàng dư (Chờ hàng)`);
    setSel({stage:"",keys:new Set()});setCustomQty({});
  };

  const [customQty,setCustomQty]=useState({});

  const copyList=(stage)=>{
    const qtyKey=stage==="cd"?"chuaDat":stage==="ds"?"dangShip":"choHang";
    const list=gzData.filter(g=>g[qtyKey]>0);
    const text=list.map(g=>{
      const ri=gzData.indexOf(g);
      const qty=customQty[ri]!==undefined?customQty[ri]:g[qtyKey];
      return g.ma+" | "+g.size+" | "+g.color+" | SL: "+qty;
    }).join("\n");
    const total=list.reduce((s,g)=>{const ri=gzData.indexOf(g);return s+(customQty[ri]!==undefined?Number(customQty[ri]):g[qtyKey]);},0);
    copyText("ĐẶT GZ:\n\n"+text+"\n\nTổng: "+total+" SP");
  };

  const itemsCD=gzData.filter(g=>g.chuaDat>0);
  const itemsCH=gzData.filter(g=>g.choHang>0);
  const itemsDS=gzData.filter(g=>g.dangShip>0);

  const Section=({title,icon,color,items,stage,qtyKey,nextStatus,nextLabel,nextIcon})=>{
    if(!items.length)return null;
    const isSel=sel.stage===stage;
    const selCount=isSel?[...sel.keys].filter(k=>items.some(g=>gzData.indexOf(g)===k)).length:0;
    const totalQty=items.reduce((s,g)=>s+g[qtyKey],0);
    return <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <h3 style={{fontSize:14,fontWeight:700,color}}>{icon} {title} ({totalQty} SP)</h3>
        <div style={{display:"flex",gap:4}}>
          {nextStatus&&<button onClick={()=>bulkUpdate(stage,nextStatus,nextIcon)} disabled={busy||selCount===0} style={{padding:"5px 10px",borderRadius:6,border:"none",background:selCount===0?t.bd:color,color:selCount===0?t.dm:"#fff",fontSize:10,fontWeight:600,cursor:"pointer"}}>{nextIcon} {nextLabel} {selCount>0?"("+selCount+")":""}</button>}
          <button onClick={()=>copyList(stage)} style={{padding:"5px 10px",borderRadius:6,border:"none",background:t.ab,color:t.ac,fontSize:10,fontWeight:600,cursor:"pointer"}}>📋</button>
        </div>
      </div>
      <div style={{background:t.sf,borderRadius:10,border:"1px solid "+t.bd,overflow:"hidden"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
          <thead><tr style={{borderBottom:"2px solid "+t.bd}}>
            {nextStatus&&<th style={{padding:"6px 4px",width:24}}><input type="checkbox" checked={isSel&&selCount===items.length} onChange={()=>{const idxs=items.map(g=>gzData.indexOf(g));if(isSel&&selCount===items.length)setSel({stage:"",keys:new Set()});else setSel({stage,keys:new Set(idxs)});}}/></th>}
            {["Mã","Tên SP","Sz","Màu","SL","Đặt"].map(h=><th key={h} style={{padding:"6px 4px",textAlign:"left",color:t.dm,fontWeight:600,fontSize:9}}>{h}</th>)}
          </tr></thead>
          <tbody>{items.map((g,i)=>{const ri=gzData.indexOf(g);const checked=isSel&&sel.keys.has(ri);const editQty=customQty[ri]!==undefined?customQty[ri]:g[qtyKey];
            return <tr key={ri} style={{borderBottom:"1px solid "+t.bd,background:checked?t.ab:"transparent"}}>
              {nextStatus&&<td style={{padding:"5px 4px"}}><input type="checkbox" checked={checked} onChange={()=>{const ns=new Set(sel.stage===stage?sel.keys:[]);if(ns.has(ri))ns.delete(ri);else ns.add(ri);setSel({stage,keys:ns});}}/></td>}
              <td style={{padding:"5px 4px",fontWeight:600,color:t.ac}}>{g.ma}</td>
              <td style={{padding:"5px 4px",color:t.dm,fontSize:11,maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{g.ten}</td>
              <td style={{padding:"5px 4px",fontSize:10}}>{g.size}</td>
              <td style={{padding:"5px 4px",fontSize:10}}>{g.color}</td>
              <td style={{padding:"5px 4px",fontWeight:700,color}}>{g[qtyKey]}</td>
              <td style={{padding:"5px 4px"}}>{stage==="cd"?<input value={editQty} onChange={e=>setCustomQty(p=>({...p,[ri]:e.target.value}))} type="number" style={{width:40,padding:"2px 4px",borderRadius:4,border:"1px solid "+t.bd,fontSize:11,textAlign:"center",background:t.inp,color:t.tx}}/>:<span style={{color:t.dm,fontSize:10}}>—</span>}</td>
            </tr>;})}</tbody>
        </table>
      </div>
    </div>;
  };

  const surplusTotal=surplusData?surplusData.reduce((s,x)=>s+x.sl,0):0;

  return <div>
    <h2 style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:4}}>🏭 Pipeline đặt hàng</h2>
    <p style={{color:t.dm,fontSize:11,marginBottom:12}}>CHƯA ĐẶT → Chờ hàng → Đang ship → Về kho (auto khi nhập kho)</p>
    <div style={{display:"flex",gap:4,marginBottom:14,overflowX:"auto"}}>
      {[{l:"Chưa đặt",v:stats.cd,c:"#94A3B8",i:"⚪"},{l:"Chờ hàng",v:stats.ch,c:"#D97706",i:"🟡"},{l:"Đang ship",v:stats.ds,c:"#7C3AED",i:"🟣"},{l:"Hàng dư",v:surplusTotal,c:"#16A34A",i:"📦"}].map((s,idx)=>
        <div key={idx} style={{background:t.sf,borderRadius:10,padding:"8px 12px",border:"1px solid "+t.bd,flex:1,textAlign:"center"}}>
          <div style={{fontSize:16,fontWeight:800,color:s.c}}>{s.v}</div>
          <div style={{fontSize:8,color:t.dm}}>{s.i} {s.l}</div>
        </div>)}
    </div>
    <Section title="Chưa đặt → Đặt GZ" icon="⚪" color="#94A3B8" items={itemsCD} stage="cd" qtyKey="chuaDat" nextStatus="Chờ hàng" nextLabel="Đặt GZ" nextIcon="🏭"/>
    <Section title="Chờ hàng → Đang ship" icon="🟡" color="#D97706" items={itemsCH} stage="ch" qtyKey="choHang" nextStatus="Đang ship" nextLabel="Đang ship" nextIcon="🚢"/>
    <Section title="Đang ship → chờ về kho" icon="🟣" color="#7C3AED" items={itemsDS} stage="ds" qtyKey="dangShip"/>
    {!itemsCD.length&&!itemsCH.length&&!itemsDS.length&&<div style={{background:t.sf,borderRadius:12,padding:30,textAlign:"center",border:"1px solid "+t.bd}}><div style={{fontSize:32,marginBottom:8}}>✅</div><p style={{color:t.tx,fontWeight:600}}>Tất cả đã Về kho hoặc Đã gửi</p></div>}
  </div>;
}

// ═══ EMS TAB ═══
function EMSTab({active,catalog,emsHistory,safePost,busy,t,msg,bank}){
  const [sel,setSel]=useState(new Set());
  const [emsCode,setEmsCode]=useState("");
  const [qtyMap,setQtyMap]=useState({});
  const [manual,setManual]=useState([]);
  const [editingHist,setEditingHist]=useState(null); // {rowIndex, emsCode, items}
  const [searchWait,setSearchWait]=useState(""); // ★ v3.2: search Chờ hàng
  const [searchHist,setSearchHist]=useState(""); // ★ v3.2: search Lịch sử EMS
  const norm=v=>String(v||"").replace(/\.0$/,"").trim().toUpperCase();

  // ★ Load draft khi đổi mã EMS
  useEffect(()=>{
    if(!emsCode){setSel(new Set());setQtyMap({});setManual([]);return;}
    try{
      const drafts=JSON.parse(localStorage.getItem("dt_ems_drafts")||"{}");
      const d=drafts[emsCode.toUpperCase()];
      if(d){
        setSel(new Set(d.sel||[]));
        setQtyMap(d.qtyMap||{});
        setManual(d.manual||[]);
      }
    }catch(e){}
  },[emsCode]);

  // ★ Auto-save draft khi sel/qtyMap/manual đổi
  useEffect(()=>{
    if(!emsCode)return;
    try{
      const drafts=JSON.parse(localStorage.getItem("dt_ems_drafts")||"{}");
      const code=emsCode.toUpperCase();
      if(sel.size===0&&Object.keys(qtyMap).length===0&&manual.length===0){
        delete drafts[code];
      }else{
        drafts[code]={sel:[...sel],qtyMap,manual,savedAt:new Date().toISOString()};
      }
      localStorage.setItem("dt_ems_drafts",JSON.stringify(drafts));
    }catch(e){}
  },[sel,qtyMap,manual,emsCode]);

  // Lookup ảnh từ catalog theo mã SP
  const getImg=(ma)=>{
    const c=catalog.find(x=>norm(x["Mã SP"])===norm(ma));
    return c?String(c["image"]||c["Ảnh"]||"").trim():"";
  };

  // Tất cả đơn "Chờ hàng" group theo SKU
  const choHang=useMemo(()=>{
    const map={};
    active.filter(o=>o["TRẠNG THÁI"]==="Chờ hàng").forEach(o=>{
      const k=norm(o["Mã SP"])+"|"+norm(o["SIZE"])+"|"+norm(o["COLOR"]);
      if(!map[k])map[k]={ma:o["Mã SP"],ten:o["Tên Sp"]||"",size:o["SIZE"],color:o["COLOR"],qty:0,rows:[]};
      map[k].qty+=Number(o["Số lượng"]||0);
      map[k].rows.push(o);
    });
    return Object.entries(map).map(([k,v])=>({key:k,...v})).sort((a,b)=>b.qty-a.qty);
  },[active]);

  // ★ Lấy danh sách draft đang lưu
  const savedDrafts=useMemo(()=>{
    try{
      const drafts=JSON.parse(localStorage.getItem("dt_ems_drafts")||"{}");
      return Object.entries(drafts).map(([code,d])=>({
        code,
        count:(d.sel?.length||0)+(d.manual?.length||0),
        savedAt:d.savedAt
      })).sort((a,b)=>(b.savedAt||"").localeCompare(a.savedAt||""));
    }catch(e){return [];}
  },[emsCode,sel,qtyMap,manual]);

  // ★ v3.2: filter Chờ hàng theo search (mã SP / tên SP / size / color)
  const choHangFiltered=useMemo(()=>{
    const q=searchWait.trim().toLowerCase();
    if(!q)return choHang;
    return choHang.filter(g=>{
      return String(g.ma||"").toLowerCase().includes(q)
        ||String(g.ten||"").toLowerCase().includes(q)
        ||String(g.size||"").toLowerCase().includes(q)
        ||String(g.color||"").toLowerCase().includes(q);
    });
  },[choHang,searchWait]);

  // Items đã chọn
  const selItems=choHang.filter(g=>sel.has(g.key));
  const allLines=[
    ...selItems.map(g=>({ma:g.ma,size:g.size,color:g.color,qty:Number(qtyMap[g.key]!==undefined?qtyMap[g.key]:g.qty)})),
    ...manual.filter(m=>m.sku).map(m=>({ma:m.sku,size:m.size,color:m.color,qty:Number(m.qty||1)}))
  ];
  const totalQty=allLines.reduce((s,l)=>s+l.qty,0);

  const copyPacking=()=>{
    const lines=allLines.map(l=>`${l.ma} | ${l.size} | ${l.color} | x${l.qty}`);
    const txt=`📦 KIỆN EMS: ${emsCode||"_______________"}\n${"━".repeat(35)}\n\n${"STT".padEnd(4)}${"Mã SP".padEnd(10)}${"Size".padEnd(6)}${"Màu".padEnd(12)}${"SL"}\n${"─".repeat(35)}\n${allLines.map((l,i)=>`${String(i+1).padEnd(4)}${String(l.ma).padEnd(10)}${String(l.size).padEnd(6)}${String(l.color).padEnd(12)}${l.qty}`).join("\n")}\n${"─".repeat(35)}\nTổng: ${totalQty} SP · ${allLines.length} SKU\n${"━".repeat(35)}\n\n📅 ${new Date().toLocaleDateString("vi-VN")}\n🌸 Shop MAM`;
    copyText(txt);
    msg("📋 Đã copy packing list");
  };

  const downloadPDF=()=>{
    const rows=allLines.map((l,i)=>{
      const img=getImg(l.ma);
      const imgHtml=img?`<img src="${img}" style="width:60px;height:60px;object-fit:cover;border-radius:4px;border:1px solid #eee" onerror="this.style.display='none'"/>`:`<div style="width:60px;height:60px;background:#f3f3f3;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#999">No img</div>`;
      return `<tr><td>${i+1}</td><td style="padding:4px">${imgHtml}</td><td><b>${l.ma}</b></td><td>${l.size}</td><td>${l.color}</td><td style="text-align:right"><b>${l.qty}</b></td></tr>`;
    }).join("");
    const html=`<html><head><meta charset="utf-8"><title>EMS ${emsCode||""}</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;padding:30px;font-size:13px}h1{font-size:18px;margin-bottom:4px}h2{font-size:13px;color:#666;margin-bottom:16px}table{width:100%;border-collapse:collapse;margin:12px 0}th{background:#7C3AED;color:#fff;padding:8px;text-align:left;font-size:11px}td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:middle}.total{font-size:16px;font-weight:bold;margin:12px 0;padding:10px;background:#F3EEFF;border-radius:8px}.ems{font-family:monospace;font-size:20px;font-weight:bold;letter-spacing:2px;padding:10px;border:2px solid #F59E0B;border-radius:8px;text-align:center;margin:12px 0;background:#FFFBEB}.footer{margin-top:20px;color:#999;font-size:10px;border-top:1px solid #eee;padding-top:8px}img{display:block}@media print{body{padding:15px}img{-webkit-print-color-adjust:exact;print-color-adjust:exact}}</style></head><body><h1>📦 PACKING LIST</h1><h2>${new Date().toLocaleDateString("vi-VN")} · Shop MAM</h2><div class="ems">EMS: ${emsCode||"_______________"}</div><table><thead><tr><th>#</th><th>Ảnh</th><th>Mã SP</th><th>Size</th><th>Màu</th><th style="text-align:right">SL</th></tr></thead><tbody>${rows}</tbody></table><div class="total">Tổng: ${totalQty} SP · ${allLines.length} SKU</div><div class="footer">Dream Team · Auto generated</div></body></html>`;
    const w=window.open("","_blank","width=700,height=900");
    if(w){w.document.write(html);w.document.close();setTimeout(()=>{w.print();},1000);}
  };

  // ★ Ship đợt này (giữ form, có thể ship tiếp với cùng mã EMS)
  const shipBatch=async(clearAfter)=>{
    if(!allLines.length){msg("⚠️ Chưa có SP nào");return;}
    if(!emsCode){msg("⚠️ Nhập mã EMS trước khi ship");return;}
    const confirmMsg=clearAfter
      ?`📦 CHỐT KIỆN ${emsCode}\n${allLines.length} SKU · ${totalQty} SP\n\nSẽ:\n• Đơn "Chờ hàng" → "Về kho"\n• Ghi ${totalQty} SP vào KHO HÀNG\n• Lưu LỊCH SỬ EMS\n• SL dư → HÀNG DƯ\n• Xoá draft\n\nOK?`
      :`📦 SHIP ĐỢT NÀY (${emsCode})\n${allLines.length} SKU · ${totalQty} SP\n\nSẽ:\n• Đơn "Chờ hàng" → "Về kho"\n• Ghi ${totalQty} SP vào KHO HÀNG\n• Lưu thêm 1 đợt vào LỊCH SỬ EMS\n• Form GIỮ NGUYÊN mã EMS để ship đợt tiếp\n\nOK?`;
    if(!confirm(confirmMsg))return;
    await safePost({action:"shipEMSWithStock",ems:{emsCode,items:allLines}},`✅ Kiện ${emsCode} · ${totalQty} SP vào kho`);
    // Xoá draft đã ship
    try{
      const drafts=JSON.parse(localStorage.getItem("dt_ems_drafts")||"{}");
      delete drafts[emsCode.toUpperCase()];
      localStorage.setItem("dt_ems_drafts",JSON.stringify(drafts));
    }catch(e){}
    setSel(new Set());setQtyMap({});setManual([]);
    if(clearAfter)setEmsCode("");
    else msg(`✅ Đã ship đợt. Mã EMS giữ nguyên — tick SP tiếp để ship đợt sau`);
  };

  // ★ Xoá draft hiện tại
  const clearDraft=()=>{
    if(!emsCode)return;
    if(!confirm(`Xoá draft của mã ${emsCode}?`))return;
    try{
      const drafts=JSON.parse(localStorage.getItem("dt_ems_drafts")||"{}");
      delete drafts[emsCode.toUpperCase()];
      localStorage.setItem("dt_ems_drafts",JSON.stringify(drafts));
    }catch(e){}
    setSel(new Set());setQtyMap({});setManual([]);
    msg("🗑 Đã xoá draft");
  };

  // ★ v3.1: Gộp lịch sử theo mã EMS (sync trực tiếp từ Sheet, không dùng override)
  const groupedHistory=useMemo(()=>{
    if(!emsHistory||!emsHistory.length)return [];
    const map={};
    emsHistory.forEach((h,idx)=>{
      const code=h.emsCode;
      let items=[];try{items=Array.isArray(h.items)?h.items:(typeof h.items==="string"?JSON.parse(h.items):[]);}catch(e){}
      if(!map[code])map[code]={emsCode:code,batches:[],totalSku:0,totalQty:0,latestDate:""};
      const totalQ=items.reduce((s,it)=>s+Number(it.qty||0),0);
      const hDate=h.date||String(h.createdAt||"").slice(0,10);
      map[code].batches.push({original:h,originalIdx:idx,items,date:hDate,skuCount:items.length,totalQty:totalQ,rowIndex:h._rowIndex!=null?h._rowIndex:(h.id!=null?h.id:idx)});
      map[code].totalSku+=items.length;
      map[code].totalQty+=totalQ;
      if((hDate||"")>map[code].latestDate)map[code].latestDate=hDate||"";
    });
    return Object.values(map).sort((a,b)=>b.latestDate.localeCompare(a.latestDate));
  },[emsHistory]);

  // ★ v3.2: filter Lịch sử EMS theo search (mã EMS hoặc mã SP trong items)
  const filteredHistory=useMemo(()=>{
    const q=searchHist.trim().toLowerCase();
    if(!q)return groupedHistory;
    return groupedHistory.filter(g=>{
      if(String(g.emsCode||"").toLowerCase().includes(q))return true;
      // Match mã SP / size / color trong bất kỳ đợt nào
      return g.batches.some(b=>b.items.some(it=>
        String(it.sku||"").toLowerCase().includes(q)
        ||String(it.size||"").toLowerCase().includes(q)
        ||String(it.color||"").toLowerCase().includes(q)
      ));
    });
  },[groupedHistory,searchHist]);

  // ★ v3.2: check 1 item có match search không (để highlight)
  const itemMatches=(it)=>{
    const q=searchHist.trim().toLowerCase();
    if(!q)return false;
    return String(it.sku||"").toLowerCase().includes(q)
      ||String(it.size||"").toLowerCase().includes(q)
      ||String(it.color||"").toLowerCase().includes(q);
  };

  // ★ v3.1: Lưu edit lên backend (sync đa máy)
  const saveHistEdit=async()=>{
    if(!editingHist||editingHist.rowIndex==null)return;
    const cleanItems=editingHist.items.filter(it=>it.ma||it.sku).map(it=>({ma:it.ma||it.sku||"",size:it.size||"",color:it.color||"",qty:Number(it.qty||0)}));
    if(!cleanItems.length){msg("⚠️ Cần ít nhất 1 SP");return;}
    if(!editingHist.emsCode){msg("⚠️ Mã EMS không được rỗng");return;}
    await safePost({action:"editEMSHistory",rowIndex:editingHist.rowIndex,ems:{emsCode:editingHist.emsCode,items:cleanItems}},`✅ Đã cập nhật lịch sử EMS`);
    setEditingHist(null);
  };

  // ★ v3.1: Xoá 1 đợt EMS trên backend
  const deleteHistBatch=async(rowIndex,emsCode)=>{
    if(rowIndex==null)return;
    if(!confirm(`🗑 Xoá đợt ship này khỏi LỊCH SỬ EMS?\n(Mã: ${emsCode})\n\nLưu ý: chỉ xoá record lịch sử, KHÔNG hoàn tác trạng thái đơn / kho.`))return;
    await safePost({action:"deleteEMSHistory",rowIndex},`🗑 Đã xoá đợt ${emsCode}`);
  };

  return <div>
    <h2 style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:4}}>✈️ Kiện EMS</h2>
    <p style={{color:t.dm,fontSize:11,marginBottom:12}}>Tick SP → chỉnh SL → nhập mã EMS → ship 1 hoặc nhiều đợt · Draft tự lưu trên máy này</p>

    {/* ★ Danh sách draft đang lưu */}
    {savedDrafts.length>0&&<div style={{background:"#EEF2FF",borderRadius:10,padding:10,marginBottom:12,border:"1px solid #C7D2FE"}}>
      <div style={{fontSize:11,fontWeight:700,color:"#3730A3",marginBottom:6}}>💾 Draft đang lưu ({savedDrafts.length})</div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {savedDrafts.map(d=><button key={d.code} onClick={()=>setEmsCode(d.code)} style={{padding:"4px 8px",borderRadius:6,border:`1px solid ${emsCode.toUpperCase()===d.code?"#7C3AED":"#C7D2FE"}`,background:emsCode.toUpperCase()===d.code?"#7C3AED":"#fff",color:emsCode.toUpperCase()===d.code?"#fff":"#3730A3",fontSize:10,cursor:"pointer",fontFamily:"monospace",fontWeight:700}}>{d.code} <span style={{opacity:.7,fontWeight:400}}>({d.count})</span></button>)}
      </div>
    </div>}

    {/* Danh sách Chờ hàng */}
    <div style={{background:t.sf,borderRadius:10,border:`1px solid ${t.bd}`,overflow:"hidden",marginBottom:12}}>
      <div style={{padding:"8px 12px",background:t.bg,borderBottom:`1px solid ${t.bd}`,display:"flex",justifyContent:"space-between",alignItems:"center",gap:6,flexWrap:"wrap"}}>
        <span style={{fontSize:12,fontWeight:700,color:"#D97706"}}>🟡 Chờ hàng ({choHangFiltered.length}{searchWait?`/${choHang.length}`:""} SKU)</span>
        <div style={{display:"flex",gap:4,alignItems:"center",flex:"1 1 auto",justifyContent:"flex-end"}}>
          <input value={searchWait} onChange={e=>setSearchWait(e.target.value)} placeholder="🔍 Mã SP / size / màu" style={{padding:"4px 8px",borderRadius:6,border:`1px solid ${t.bd}`,fontSize:11,background:t.inp,color:t.tx,width:160,maxWidth:"50vw"}}/>
          {searchWait&&<button onClick={()=>setSearchWait("")} style={{padding:"3px 6px",borderRadius:4,border:"none",background:"#FEE2E2",color:"#DC2626",fontSize:10,cursor:"pointer",fontWeight:700}}>✕</button>}
          <button onClick={()=>{const targets=choHangFiltered;sel.size===targets.length&&targets.every(g=>sel.has(g.key))?setSel(prev=>{const next=new Set(prev);targets.forEach(g=>next.delete(g.key));return next;}):setSel(new Set(targets.map(g=>g.key)));}} style={{fontSize:10,padding:"3px 8px",borderRadius:4,border:"none",background:t.ab,color:t.ac,cursor:"pointer",fontWeight:600}}>{sel.size===choHangFiltered.length&&choHangFiltered.every(g=>sel.has(g.key))?"Bỏ chọn":"Chọn tất cả"}</button>
        </div>
      </div>
      {choHangFiltered.length===0&&<div style={{padding:20,textAlign:"center",color:t.dm}}>{searchWait?`Không có SKU nào khớp "${searchWait}"`:"Không có đơn Chờ hàng"}</div>}
      {choHangFiltered.map(g=>{const checked=sel.has(g.key);const q=qtyMap[g.key]!==undefined?qtyMap[g.key]:g.qty;const img=getImg(g.ma);
        return <div key={g.key} onClick={()=>setSel(p=>{const n=new Set(p);n.has(g.key)?n.delete(g.key):n.add(g.key);return n;})} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderBottom:`1px solid ${t.bd}`,cursor:"pointer",background:checked?"#FFFBEB":"transparent"}}>
          <input type="checkbox" checked={checked} readOnly/>
          {img?<img src={img} style={{width:36,height:36,objectFit:"cover",borderRadius:4,border:`1px solid ${t.bd}`}} onError={e=>e.target.style.display="none"}/>:<div style={{width:36,height:36,borderRadius:4,background:t.bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,color:t.dm,flexShrink:0}}>📷</div>}
          <span style={{fontWeight:600,color:t.ac,width:50}}>{g.ma}</span>
          <span style={{fontSize:11,color:t.tx,flex:1}}>{g.ten}</span>
          <span style={{fontSize:11,width:28}}>{g.size}</span>
          <span style={{fontSize:11,width:60,color:t.dm}}>{g.color}</span>
          {checked?<input value={q} onClick={e=>e.stopPropagation()} onChange={e=>setQtyMap(p=>({...p,[g.key]:e.target.value}))} type="number" min="1" style={{width:50,padding:"4px",borderRadius:6,border:"2px solid #F59E0B",fontSize:13,fontWeight:700,textAlign:"center",background:"#FFFBEB",color:"#78350F"}}/>
          :<span style={{width:50,textAlign:"center",fontWeight:600,color:t.dm}}>{g.qty}</span>}
        </div>;})}
    </div>

    {/* Nhập tay */}
    {manual.length>0&&<div style={{background:"#FEF3C7",borderRadius:10,padding:10,marginBottom:12,border:"1px solid #FDE68A"}}>
      <div style={{fontSize:11,fontWeight:600,color:"#92400E",marginBottom:6}}>✏️ Thêm thủ công</div>
      {manual.map((m,i)=><div key={i} style={{display:"flex",gap:4,marginBottom:4,alignItems:"center"}}>
        <input value={m.sku} onChange={e=>{const n=[...manual];n[i].sku=e.target.value;setManual(n);}} placeholder="Mã SP" style={{flex:1,padding:"6px 8px",borderRadius:6,border:"1px solid #F59E0B",fontSize:12,background:"#fff"}}/>
        <input value={m.size} onChange={e=>{const n=[...manual];n[i].size=e.target.value;setManual(n);}} placeholder="Sz" style={{width:35,padding:"6px 4px",borderRadius:6,border:"1px solid #F59E0B",fontSize:12,background:"#fff",textAlign:"center"}}/>
        <input value={m.color} onChange={e=>{const n=[...manual];n[i].color=e.target.value;setManual(n);}} placeholder="Màu" style={{width:55,padding:"6px 4px",borderRadius:6,border:"1px solid #F59E0B",fontSize:12,background:"#fff",textAlign:"center"}}/>
        <input value={m.qty} onChange={e=>{const n=[...manual];n[i].qty=e.target.value;setManual(n);}} type="number" min="1" style={{width:45,padding:"6px 4px",borderRadius:6,border:"1px solid #F59E0B",fontSize:13,fontWeight:700,background:"#fff",textAlign:"center"}}/>
        <button onClick={()=>setManual(p=>p.filter((_,j)=>j!==i))} style={{border:"none",background:"none",cursor:"pointer",color:"#DC2626",fontSize:13}}>✕</button>
      </div>)}
    </div>}
    <button onClick={()=>setManual(p=>[...p,{sku:"",size:"",color:"",qty:"1"}])} style={{width:"100%",padding:8,borderRadius:8,border:`1px dashed ${t.bd}`,background:"transparent",color:t.dm,fontSize:11,cursor:"pointer",marginBottom:12}}>＋ Thêm SP thủ công</button>

    {/* Tổng kết + EMS code */}
    {(allLines.length>0||emsCode)&&<div style={{background:"#FFFBEB",borderRadius:12,padding:14,border:"2px solid #F59E0B",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,alignItems:"center"}}>
        <span style={{fontSize:14,fontWeight:800,color:"#92400E"}}>📦 {allLines.length} SKU · {totalQty} SP</span>
        {emsCode&&allLines.length>0&&<button onClick={clearDraft} style={{padding:"3px 8px",borderRadius:6,border:"1px solid #DC2626",background:"#fff",color:"#DC2626",fontSize:10,cursor:"pointer",fontWeight:600}}>🗑 Xoá draft</button>}
      </div>
      <input value={emsCode} onChange={e=>setEmsCode(e.target.value.toUpperCase())} placeholder="MÃ EMS (VD: EJ123456789CN)" style={{width:"100%",padding:"10px 12px",borderRadius:8,border:"2px solid #F59E0B",fontSize:16,fontWeight:800,background:"#fff",color:"#78350F",marginBottom:10,textAlign:"center",letterSpacing:2,fontFamily:"monospace"}}/>
      {emsCode&&<div style={{fontSize:10,color:"#92400E",marginBottom:8,textAlign:"center",fontStyle:"italic"}}>💾 Draft tự lưu mỗi khi chỉnh sửa</div>}
      <div style={{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}}>
        <button onClick={copyPacking} disabled={!allLines.length} style={{flex:"1 1 80px",padding:10,borderRadius:8,border:"none",background:"#7C3AED",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",opacity:!allLines.length?.5:1}}>📋 Copy</button>
        <button onClick={downloadPDF} disabled={!allLines.length} style={{flex:"1 1 80px",padding:10,borderRadius:8,border:"none",background:"#DC2626",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",opacity:!allLines.length?.5:1}}>📄 PDF</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        <button onClick={()=>shipBatch(false)} disabled={busy||!allLines.length||!emsCode} style={{flex:"1 1 120px",padding:12,borderRadius:8,border:"none",background:"#0D9488",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(busy||!allLines.length||!emsCode)?.5:1}} title="Ship đợt này nhưng giữ mã EMS để ship tiếp đợt sau">🚢 Ship đợt này</button>
        <button onClick={()=>shipBatch(true)} disabled={busy||!allLines.length||!emsCode} style={{flex:"1 1 120px",padding:12,borderRadius:8,border:"none",background:"#D97706",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(busy||!allLines.length||!emsCode)?.5:1}} title="Ship và đóng kiện (xoá mã EMS)">✅ Chốt kiện</button>
      </div>
    </div>}

    {allLines.length===0&&sel.size===0&&!emsCode&&<div style={{background:t.sf,borderRadius:12,padding:20,textAlign:"center",border:`1px solid ${t.bd}`}}>
      <div style={{fontSize:24,marginBottom:8}}>✈️</div>
      <p style={{color:t.dm,fontSize:12}}>Tick SP ở trên → tạo packing list</p>
    </div>}

    {/* ★ LỊCH SỬ EMS — gộp theo mã, có edit */}
    {groupedHistory.length>0&&<div style={{marginTop:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8,gap:6,flexWrap:"wrap"}}>
        <h3 style={{fontSize:14,fontWeight:700,color:t.tx,margin:0}}>📜 Lịch sử EMS ({filteredHistory.length}{searchHist?`/${groupedHistory.length}`:""} mã · {emsHistory.length} đợt)</h3>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <input value={searchHist} onChange={e=>setSearchHist(e.target.value)} placeholder="🔍 Mã EMS / mã SP" style={{padding:"4px 8px",borderRadius:6,border:`1px solid ${t.bd}`,fontSize:11,background:t.inp,color:t.tx,width:180,maxWidth:"60vw"}}/>
          {searchHist&&<button onClick={()=>setSearchHist("")} style={{padding:"3px 6px",borderRadius:4,border:"none",background:"#FEE2E2",color:"#DC2626",fontSize:10,cursor:"pointer",fontWeight:700}}>✕</button>}
        </div>
      </div>
      {filteredHistory.length===0&&searchHist&&<div style={{padding:16,textAlign:"center",color:t.dm,background:t.sf,borderRadius:8,border:`1px solid ${t.bd}`}}>Không tìm thấy "{searchHist}" trong lịch sử EMS</div>}
      {filteredHistory.slice(0,30).map((g,gi)=>{
        const multiBatch=g.batches.length>1;
        // ★ v3.2: auto-open details nếu đang search và group này match
        const autoOpen=!!searchHist;
        return <details key={gi} open={autoOpen||undefined} style={{marginBottom:6,background:t.sf,borderRadius:8,border:`1px solid ${t.bd}`,overflow:"hidden"}}>
          <summary style={{padding:"8px 12px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:12}}>
            <span style={{display:"flex",alignItems:"center",gap:6}}>
              <span style={{fontWeight:700,color:"#F59E0B",fontFamily:"monospace"}}>{g.emsCode}</span>
              {multiBatch&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:"#0D9488",color:"#fff",fontWeight:700}}>{g.batches.length} đợt</span>}
            </span>
            <span style={{color:t.dm,fontSize:10}}>{g.latestDate} · {g.totalSku} SKU · {g.totalQty} SP</span>
          </summary>
          <div style={{padding:"6px 12px 10px",borderTop:`1px solid ${t.bd}`}}>
            {g.batches.map((b,bi)=>{
              const isEditing=editingHist&&editingHist.rowIndex===b.rowIndex;
              return <div key={bi} style={{marginBottom:multiBatch?10:0,paddingBottom:multiBatch?10:0,borderBottom:multiBatch&&bi<g.batches.length-1?`1px dashed ${t.bd}`:"none"}}>
                {multiBatch&&<div style={{fontSize:10,color:t.dm,marginBottom:4,fontWeight:600}}>📦 Đợt {bi+1} · {b.date} · {b.totalQty} SP</div>}

                {isEditing?<div style={{background:"#FEF3C7",borderRadius:8,padding:8,marginBottom:6,border:"1px solid #F59E0B"}}>
                  <div style={{fontSize:11,fontWeight:700,color:"#92400E",marginBottom:6}}>✏️ Đang sửa (lưu trực tiếp lên Google Sheet)</div>
                  <input value={editingHist.emsCode} onChange={e=>setEditingHist({...editingHist,emsCode:e.target.value.toUpperCase()})} placeholder="Mã EMS" style={{width:"100%",padding:"6px 8px",borderRadius:6,border:"1px solid #F59E0B",fontSize:12,fontWeight:700,fontFamily:"monospace",marginBottom:6,background:"#fff"}}/>
                  {editingHist.items.map((it,ii)=><div key={ii} style={{display:"flex",gap:4,marginBottom:3,alignItems:"center"}}>
                    <input value={it.sku} onChange={e=>{const n=[...editingHist.items];n[ii].sku=e.target.value;setEditingHist({...editingHist,items:n});}} placeholder="Mã SP" style={{flex:1,padding:"4px 6px",borderRadius:4,border:"1px solid #F59E0B",fontSize:11,background:"#fff"}}/>
                    <input value={it.size||""} onChange={e=>{const n=[...editingHist.items];n[ii].size=e.target.value;setEditingHist({...editingHist,items:n});}} placeholder="Sz" style={{width:35,padding:"4px",borderRadius:4,border:"1px solid #F59E0B",fontSize:11,background:"#fff",textAlign:"center"}}/>
                    <input value={it.color||""} onChange={e=>{const n=[...editingHist.items];n[ii].color=e.target.value;setEditingHist({...editingHist,items:n});}} placeholder="Màu" style={{width:55,padding:"4px",borderRadius:4,border:"1px solid #F59E0B",fontSize:11,background:"#fff",textAlign:"center"}}/>
                    <input value={it.qty} onChange={e=>{const n=[...editingHist.items];n[ii].qty=e.target.value;setEditingHist({...editingHist,items:n});}} type="number" min="1" style={{width:45,padding:"4px",borderRadius:4,border:"1px solid #F59E0B",fontSize:12,fontWeight:700,background:"#fff",textAlign:"center"}}/>
                    <button onClick={()=>{const n=editingHist.items.filter((_,j)=>j!==ii);setEditingHist({...editingHist,items:n});}} style={{border:"none",background:"none",cursor:"pointer",color:"#DC2626",fontSize:12}}>✕</button>
                  </div>)}
                  <button onClick={()=>setEditingHist({...editingHist,items:[...editingHist.items,{sku:"",size:"",color:"",qty:"1"}]})} style={{width:"100%",padding:6,borderRadius:6,border:"1px dashed #F59E0B",background:"transparent",color:"#92400E",fontSize:11,cursor:"pointer",marginTop:4,marginBottom:6}}>＋ Thêm SP</button>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={saveHistEdit} style={{flex:1,padding:8,borderRadius:6,border:"none",background:"#16A34A",color:"#fff",fontSize:11,fontWeight:700,cursor:"pointer"}}>💾 Lưu</button>
                    <button onClick={()=>setEditingHist(null)} style={{flex:1,padding:8,borderRadius:6,border:`1px solid ${t.bd}`,background:t.sf,color:t.tx,fontSize:11,cursor:"pointer"}}>Huỷ</button>
                  </div>
                </div>:<table style={{width:"100%",fontSize:10,borderCollapse:"collapse"}}>
                  <thead><tr style={{color:t.dm}}>
                    <th style={{textAlign:"left",padding:"2px 4px"}}>Ảnh</th>
                    <th style={{textAlign:"left",padding:"2px 4px"}}>Mã SP</th>
                    <th style={{textAlign:"left",padding:"2px 4px"}}>Size</th>
                    <th style={{textAlign:"left",padding:"2px 4px"}}>Màu</th>
                    <th style={{textAlign:"right",padding:"2px 4px"}}>SL</th>
                  </tr></thead>
                  <tbody>{b.items.map((it,j)=>{
                    const img=getImg(it.ma||it.sku);
                    const hit=itemMatches(it); // ★ v3.2: highlight nếu match search
                    return <tr key={j} style={{borderBottom:`1px solid ${t.bd}22`,background:hit?"#FEF9C3":"transparent"}}>
                      <td style={{padding:"2px 4px"}}>{img?<img src={img} style={{width:28,height:28,objectFit:"cover",borderRadius:3}} onError={e=>e.target.style.display="none"}/>:<span style={{fontSize:8,color:t.dm}}>📷</span>}</td>
                      <td style={{padding:"2px 4px",fontWeight:hit?800:600,color:hit?"#854D0E":t.ac}}>{it.sku}</td>
                      <td style={{padding:"2px 4px",color:t.tx}}>{it.size}</td>
                      <td style={{padding:"2px 4px",color:t.tx}}>{it.color}</td>
                      <td style={{padding:"2px 4px",textAlign:"right",fontWeight:600}}>{it.qty}</td>
                    </tr>})}</tbody>
                </table>}

                {!isEditing&&<div style={{marginTop:6,display:"flex",gap:4,flexWrap:"wrap"}}>
                  <button onClick={async()=>{
                    const totalQtyH=b.items.reduce((s,it)=>s+Number(it.qty||0),0);
                    if(!confirm(`🔄 Ship lại đợt này (${g.emsCode})\n${b.items.length} SKU · ${totalQtyH} SP\n\nOK?`))return;
                    await safePost({action:"shipEMSWithStock",ems:{emsCode:g.emsCode,items:b.items.map(i=>({...i, ma:i.ma||i.sku||""}))}},`✅ Kiện ${g.emsCode} · ${totalQtyH} SP vào kho`);
                  }} style={{padding:"4px 10px",borderRadius:6,border:"none",background:"#F59E0B",color:"#fff",fontSize:10,cursor:"pointer",fontWeight:700}}>🔄 Ship lại</button>

// ★ Japanese address parser
const JP_PREFS=["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"];
function parseJPAddr(raw){
  let s=raw.trim();
  let postal="",pref="",city="",street="";
  // Extract postal
  const pm=s.match(/(\d{3})-?(\d{4})/);
  if(pm){postal=pm[1]+"-"+pm[2];s=s.replace(pm[0],"").trim();}
  // Save original (after postal removal) for integrity check
  const original=s;
  // Extract prefecture
  for(const p of JP_PREFS){if(s.startsWith(p)){pref=p;s=s.slice(p.length);break;}}
  // Extract city
  let cm=s.match(/^(.+?[市郡])(.+?[区町村])/);
  if(cm){
    city=cm[1]+cm[2];
    s=s.slice(city.length);
  }else{
    cm=s.match(/^(.+?[市区町村郡])/);
    if(cm){
      city=cm[1];
      s=s.slice(city.length);
      if(city.endsWith("市")&&s.startsWith("市")&&!/^市[区町村]/.test(s)){
        city+="市";s=s.slice(1);
      }
      if(city.endsWith("村")){
        const ext=s.match(/^(.{1,3}市)/);
        if(ext&&!/市.+?[区町村]/.test(s)){city+=ext[1];s=s.slice(ext[1].length);}
      }
    }
  }
  street=s.trim();
  // ★ INTEGRITY CHECK: pref+city+street must equal original (no lost characters)
  const rebuilt=(pref+city+street).replace(/\s/g,"");
  const orig=original.replace(/\s/g,"");
  if(rebuilt!==orig){
    // Parser lost characters → DON'T split, keep everything in street
    return{postal,pref:"",city:"",street:original.trim()};
  }
  return{postal,pref,city,street};
}
// ★ Auto-fill + Auto-correct address from postal code
const zipPrefCache={};
async function autoFillPref(parsed){
  const clean=(parsed.postal||"").replace(/[^0-9]/g,"");
  if(clean.length!==7)return parsed;
  if(zipPrefCache[clean]){return{...parsed,...zipPrefCache[clean]};}
  try{
    const r=await fetch("https://zipcloud.ibsnet.co.jp/api/search?zipcode="+clean);
    const j=await r.json();
    if(j.results&&j.results[0]){
      const a=j.results[0];
      const apiPref=a.address1||"";
      const apiCity=a.address2||"";
      const apiTown=a.address3||"";
      // ★ INTEGRITY: original full address (without postal & spaces)
      const originalFull=((parsed.pref||"")+(parsed.city||"")+(parsed.street||"")).replace(/\s/g,"");
      let newStreet=parsed.street||"";
      if(apiCity&&parsed.city!==apiCity){
        // Parser got city wrong → recalculate street
        // Try: originalFull = apiPref + apiCity + realStreet
        const prefCityPrefix=apiPref+apiCity;
        if(originalFull.startsWith(prefCityPrefix)){
          newStreet=originalFull.slice(prefCityPrefix.length);
        }else if(originalFull.startsWith(apiCity)){
          newStreet=originalFull.slice(apiCity.length);
        }else{
          // Can't match → dump everything after apiCity into street safely
          newStreet=(parsed.city||"")+(parsed.street||"");
        }
      }
      if(!newStreet&&apiTown)newStreet=apiTown;
      // ★ INTEGRITY CHECK: apiPref+apiCity+newStreet must contain all chars from original
      const rebuiltFull=(apiPref+apiCity+newStreet).replace(/\s/g,"");
      if(rebuiltFull.length<originalFull.length){
        // Lost characters! Don't use zipcloud result for city/street
        // Only safe to fill pref
        const safeFill={pref:apiPref,city:parsed.city,street:parsed.street};
        zipPrefCache[clean]=safeFill;
        return{...parsed,...safeFill};
      }
      const fill={pref:apiPref,city:apiCity,street:newStreet.trim()};
      zipPrefCache[clean]=fill;
      return{...parsed,...fill};
    }
  }catch(e){}
  return parsed;
}

function CustProfile({name,fb:fbProp,orders,addrs,safePost,msg,t}){
  const fbNorm=normalizeFB(fbProp||"");
  const co=orders.filter(o=>String(o["Tên khách"]||"").trim()===name&&normalizeFB(String(o["Link fb"]||""))===fbNorm);
  const rev=co.reduce((s,o)=>s+(Number(o["Giá sp"])||0)*Number(o["Số lượng"]||0),0);
  const items=co.reduce((s,o)=>s+Number(o["Số lượng"]||0),0);
  const fb=fbProp||co.find(o=>o["Link fb"]&&String(o["Link fb"]).startsWith("http"))?.["Link fb"]||"";
  const tier=rev>=10000?"⭐ VIP":items>=3?"💎 Thân thiết":"👤 Thường";
  const saved=getAddr(addrs,name,fb)||{};
  const savedFull=[saved.postal,saved.pref,saved.city,saved.street].filter(Boolean).join(" ");
  const [fullAddr,setFullAddr]=useState(savedFull);
  const [phone,setPhone]=useState(saved.phone||"");
  const [showAddr,setShowAddr]=useState(false);
  const parsed=useMemo(()=>parseJPAddr(fullAddr),[fullAddr]);
  const hasAddr=fullAddr.trim().length>0;
  const inp={padding:"8px 10px",border:`1.5px solid ${t.bd}`,borderRadius:8,fontSize:12,background:t.inp,color:t.tx,width:"100%",fontFamily:"inherit"};

  const doSaveAddr=async()=>{
    let addr={postal:parsed.postal,pref:parsed.pref,city:parsed.city,street:parsed.street,phone:phone};
    if(addr.postal){
      const filled=await autoFillPref(addr);
      addr=filled;
      if(filled.pref||filled.city)setFullAddr([filled.postal,filled.pref,filled.city,filled.street].filter(Boolean).join(" "));
    }
    await safePost({action:"saveAddress",name:name,fb:fb||"",address:addr},"📍 Lưu địa chỉ "+name);
  };

  return <div>
    <div style={{textAlign:"center",marginBottom:16}}><div style={{display:"flex",justifyContent:"center",marginBottom:4}}><Avatar name={name} fb={fb} size={48}/></div><div style={{fontSize:18,fontWeight:700,color:t.tx}}>{name}</div>

    </div>)}
